<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>売上在庫統合マネージャー</title>
<style>
:root{
  --bg:#f3f8ff;--panel:#fff;--line:#cfe0f5;--text:#14324f;--muted:#5f7b99;
  --blue:#1d6fd6;--blue-deep:#1254a5;--blue-soft:#e8f2ff;--sky:#eff7ff;
  --ok:#1c7a52;--ok-bg:#e8f8f0;--warn:#ad7a14;--warn-bg:#fff4d9;
  --danger:#b44747;--danger-bg:#fdeceb;
  --purple:#5e3ca8;--purple-bg:#f0eeff;
  --shadow:0 18px 42px rgba(18,84,165,.08);--radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic UI","Hiragino Sans","Segoe UI",sans-serif;background:linear-gradient(180deg,#f7fbff,#eef6ff 100%);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.container{max-width:1400px;margin:0 auto;padding:24px}
.hero{background:linear-gradient(135deg,#fff,#eef6ff);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow);margin-bottom:18px}
.hero h1{margin:0;font-size:32px}.hero p{margin:10px 0 0;color:var(--muted);line-height:1.7;max-width:920px}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:14px}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:10px 16px;font-size:14px;transition:.15s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.tab:hover:not(.active){background:var(--blue-soft);color:var(--blue-deep)}
.tab .count{margin-left:6px;background:var(--danger-bg);color:var(--danger);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
.tab.active .count{background:rgba(255,255,255,.25);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.metric{padding:18px;transition:.15s}.metric:hover{box-shadow:0 22px 48px rgba(18,84,165,.14);border-color:#a8c8f0}
.metric .label{font-size:12px;color:var(--muted);margin-bottom:6px}
.metric .value{font-size:28px;font-weight:700;color:var(--blue-deep)}
.metric .sub{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.section{padding:20px;margin-bottom:18px}
.section h2{margin:0 0 6px;font-size:22px}.section .desc{margin:0 0 16px;color:var(--muted);font-size:13px}
.btn{border:1px solid transparent;border-radius:999px;padding:10px 16px;font-size:14px;transition:.15s}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
.btn.danger{background:#fff;border-color:#f0c8c8;color:var(--danger)}
.btn.ok{background:#fff;border-color:#b2dfc8;color:var(--ok)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.alert{padding:12px 14px;border-radius:14px;font-size:14px;margin-bottom:14px;display:none}
.alert.show{display:block}.alert.info{background:var(--blue-soft);color:var(--blue-deep)}.alert.ok{background:var(--ok-bg);color:var(--ok)}.alert.err{background:var(--danger-bg);color:var(--danger)}
.note{padding:14px 16px;background:var(--sky);border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.8}
.page{display:none}.page.active{display:block}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{padding:12px 10px;border-bottom:1px solid #e5effb;text-align:left;vertical-align:top;font-size:13px}
th{background:#f7fbff;font-size:12px;color:var(--muted);position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:none}tr:hover td{background:#fbfdff}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-right:4px}
.badge.amazon_fba{background:#fff7ea;color:#d47b06}.badge.amazon_self{background:#fff7ea;color:#b8860b}.badge.mercari{background:#fff0f3;color:#d0254a}.badge.yahoo{background:#fff0f2;color:#b4152a}.badge.returns{background:#f0eeff;color:#5e3ca8}
.badge.unlisted{background:var(--purple-bg);color:var(--purple)}.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.pending{background:#f3f8ff;color:var(--muted)}
.notify{padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:12px;border-radius:var(--radius);cursor:pointer;transition:.15s}
.notify:hover{box-shadow:0 4px 16px rgba(0,0,0,.06)}
.notify .icon{font-size:20px;flex-shrink:0}.notify .body{flex:1}.notify .title{font-weight:700;font-size:14px}.notify .sub{font-size:12px;color:var(--muted);margin-top:2px}
.plat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.plat-card{padding:16px;border-radius:14px;border:1px solid var(--line);background:#fff}
.plat-card .name{font-size:13px;font-weight:600;margin-bottom:6px}
.plat-card .num{font-size:24px;font-weight:700;color:var(--blue-deep)}
input[type="search"],input[type="text"],input[type="url"],select{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 12px;border-radius:12px;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
textarea{border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;font-family:monospace;resize:vertical;background:#fafcff;color:var(--text);width:100%}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.flex-1{flex:1}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.connected-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(28,122,82,.5);display:inline-block}
@media(max-width:900px){.plat-grid{grid-template-columns:1fr}.container{padding:16px}.hero{padding:22px}}
</style>
</head>
<body>
<div class="container">
  <section class="hero">
    <div style="display:flex;gap:16px;align-items:stretch;flex-wrap:wrap">
      <div style="flex:1 1 520px;min-width:0">
        <h1 style="margin:0">📦 売上在庫統合マネージャー</h1>
        <p>仕入管理表と各販路の在庫・売上CSVを統合し、売上管理・棚卸管理・月次分析を一元化するアプリケーションです。</p>
        <div class="meta" id="hero-meta"></div>
      </div>
      <div style="flex:1 1 260px;display:flex;align-items:center;justify-content:center;padding:8px">
        <button id="hero-main-btn" onclick="showPage('monthly')" style="padding:18px 40px;border-radius:16px;border:2px solid #1c7a52;background:#1c7a52;color:#fff;cursor:pointer;font-size:20px;font-weight:800;white-space:nowrap;box-shadow:0 6px 18px rgba(28,122,82,.3)">📅 毎月の作業</button>
      </div>
    </div>
  </section>
  <div id="global-alert" class="alert"></div>
  <div id="banner-area" style="position:sticky;top:0;z-index:100"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="pages"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
// ═══════════════════════════ FIREBASE (配布版: 匿名認証 + 同期コード) ═══════════════════════════
// ★★★ 配布前にここを自分の配布用Firebaseプロジェクトの設定に書き換えてください ★★★
const firebaseConfig = {
  apiKey: "AIzaSyBrMGn-TmgCHAer_KQfSLZ8p5AAsvJVvAA",
  authDomain: "inventory-dist.firebaseapp.com",
  databaseURL: "https://inventory-dist-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "inventory-dist",
  storageBucket: "inventory-dist.firebasestorage.app",
  messagingSenderId: "1091737129182",
  appId: "1:1091737129182:web:232509aaf585340bb9724f"
};
let fbApp,fbDb,fbRef,fbConnected=false;
// 同期コード: 初回アクセス時に自動生成、複数PC同期に使用
// 同期コードの保持: localStorage ＋ URL(?code=)。ブラウザのサイトデータ削除で localStorage が消えても、
// ?code= 付きのURL（ブックマーク）から復元できる。新規発行時はコードをテキストファイルとして保存する。
function _syncCodeFromUrl(){
  try{const p=new URLSearchParams(location.search).get('code');if(p&&/^[A-Z2-9]{8,32}$/i.test(p.trim()))return p.trim().toUpperCase();}catch(e){}
  return null;
}
function _putSyncCodeInUrl(code){
  try{const u=new URL(location.href);if(u.searchParams.get('code')!==code){u.searchParams.set('code',code);history.replaceState(null,'',u.toString());}}catch(e){}
}
function _downloadSyncCodeFile(code){
  try{
    const txt='売上在庫統合マネージャー 同期コード\n\n'+code+'\n\nこのコードがあれば、ブラウザのデータを消しても別のPCでも同じデータに接続できます。\n・アプリ画面上部の「☁ 同期コード」からいつでも確認・変更できます\n・このコード付きのURLをブックマークしておくと復元が簡単です:\n  '+location.origin+location.pathname+'?code='+code+'\n・他人に教えないでください（コードを知っていれば誰でもデータにアクセスできます）\n';
    const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='同期コード_'+code+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{try{URL.revokeObjectURL(a.href);a.remove();}catch(e){}},1500);
  }catch(e){}
}
function _getSyncCode(){
  let code=null;
  try{code=JSON.parse(localStorage.getItem('dist_sync_code'));}catch{}
  const urlCode=_syncCodeFromUrl();
  if(urlCode&&urlCode!==code){
    // URLに別コードがある: ローカルが無ければURLを採用（サイトデータ削除後の復元）、あれば確認して切替
    if(!code||confirm('URLに含まれる同期コード「'+urlCode+'」に切り替えますか？\n（現在のコード: '+code+'）\n\nOK → URLのコードに切り替え（そのデータに接続）\nキャンセル → 現在のコードのまま')){
      code=urlCode;try{localStorage.setItem('dist_sync_code',JSON.stringify(code));}catch{}
    }
  }
  if(!code){
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    code='';for(let i=0;i<16;i++)code+=chars[Math.floor(Math.random()*chars.length)];
    try{localStorage.setItem('dist_sync_code',JSON.stringify(code));}catch{}
    window._syncCodeIsNew=true;
    try{setTimeout(()=>{_downloadSyncCodeFile(code);try{showBanner('同期コード「'+code+'」を発行しました。コードのテキストファイルを保存しました（Downloads）。このコードは必ず控えてください',
'ok');}catch(e){}},600);}catch(e){}
  }
  _putSyncCodeInUrl(code);
  return code;
}
const SYNC_CODE=_getSyncCode();
try {
  if(typeof firebase!=='undefined'){
    fbApp=firebase.initializeApp(firebaseConfig,'inventoryDist');
    fbDb=firebase.database(fbApp);
    fbRef=fbDb.ref('dist_users/'+SYNC_CODE);
    fbConnected=true;
  }
} catch(e) {
  console.warn('Firebase init failed:',e);
}
// 匿名認証（バックグラウンドで実行、失敗してもlocalStorageで動作継続）
async function _anonAuth(){
  if(!fbConnected)return false;
  try{
    const auth=fbApp.auth();
    if(auth.currentUser)return true;
    await Promise.race([auth.signInAnonymously(),new Promise((_,r)=>setTimeout(()=>r(new Error('auth timeout')),6000))]);
    return true;
  }catch(e){console.warn('Anonymous auth failed:',e);fbConnected=false;return false;}
}

// Debounced Firebase write
let _fbSaveTimer=null;
function fbSave(data){
  if(!fbConnected)return;
  clearTimeout(_fbSaveTimer);
  _fbSaveTimer=setTimeout(async()=>{
    try{await _anonAuth();fbRef.child('state').set(data).catch(e=>console.warn('Firebase save error:',e));}catch(e){}
  },500);
}
function fbSaveDetail(key,data){
  if(!fbConnected)return;
  (async()=>{try{await _anonAuth();fbRef.child('monthly_detail/'+key).set(data).catch(e=>console.warn('Firebase detail save error:',e));}catch(e){}})();
}
// クラウドの明細を受け取ったとき: まずローカルの全複製（localStorage / IndexedDB退避 / 未保存メモリ）から最新を決め、その上でクラウドと新旧を比較する。
// 保存時刻（_at）でクラウドが新しいと判定できた複製だけをローカルに保存する。判定できない（_at なし、または同時刻で内容が違う）ものは上書きせず記録して報告する。
// IndexedDB の読込完了（_idbReady）を待ってから比較する（待たずに比較すると退避済みの最新複製を見落とす）
async function _mdCloudReconcile(det){
  const notes=[];const saved=[];const fails=[];
  let ready=false;try{ready=await Promise.race([window._idbReady,new Promise(r=>setTimeout(()=>r('timeout'),8000))]);}catch(e){ready=false;}
  if(ready!==true){console.warn('IndexedDB の読込が完了していないためクラウド明細の取り込みを見送ります（表示には使います）');return {skipped:true};}
  for(const [k,v] of Object.entries(det||{})){
    if(!v||typeof v!=='object')continue;
    const loc=_mdChoose(_mdCandidates(k,false));
    if(!loc){const r=await _mdDetailSave(k,{...v,_at:v._at||new Date(0).toISOString()});if(r&&r.ok)saved.push(k);else fails.push(k);continue;} // ローカルに無ければ取り込む（旧形式は最古扱いの時刻を付ける）
    const best=loc.pick,vs=_mdDetailSig(v),bs=_mdDetailSig(best);
    if(vs===bs){if(window._mdCache&&window._mdCache[k]&&!best._at&&v._at){/* ローカルが旧形式で内容同一: 時刻付きクラウド複製を残して読込に使う */}else{delete window._mdCache[k];}continue;} // 内容が同じ → クラウド複製の控えは不要（毎回の比較計算も不要になる）
    if(v._at&&(!best._at||String(v._at)>String(best._at))){const r=await _mdDetailSave(k,{...v});if(r&&r.ok)saved.push(k);else fails.push(k);continue;}
    if(v._at&&best._at&&String(v._at)<String(best._at))continue; // クラウドが古い → ローカルを維持（クラウドには次回保存時に上書きされる）
    // 判定不能: 同時刻で内容が違う／どちらにも _at が無い
    _mdConflictAdd(k,[{src:loc.src,at:best._at||null,sig:bs,data:best},{src:'cloud',at:v._at||null,sig:vs,data:v}]);
    notes.push(k);
  }
  if(notes.length){try{showBanner('⚠ 月次明細の新旧を判定できない月があります（'+notes.length+'件）。上書きせず、このブラウザ内の複製を使っています。バックアップには両方の内容を含めます','warn');}catch(e){}}
  if(fails.length){try{showBanner('クラウドの明細をローカルに保存できませんでした（'+fails.join('・')+'）。表示には使いますが、この端末には残りません','err');}catch(e){}}
  return {saved,conflicts:notes,fails};
}
window._mdCloudReconcile=_mdCloudReconcile;
function fbDeleteDetail(key){
  if(!fbConnected)return;
  try{fbRef.child('monthly_detail/'+key).remove().catch(e=>{});}catch(e){}
}

// ═══════════════════════════ STATE ═══════════════════════════
const _LSP='dist_';
const LS = key => { if(typeof key==='string'&&key.indexOf('inv_md_')===0&&typeof _mdDetailPick==='function'){try{return _mdDetailPick(key);}catch(e){}} try { const v=JSON.parse(localStorage.getItem('dist_'+key)); if(v)return v; } catch {} try{ if(window._idbCache&&window._idbCache[key]!==undefined)return window._idbCache[key]; }catch(e){} if(key.startsWith('inv_md_')&&window._mdCache&&window._mdCache[key])return window._mdCache[key]; return null; };
window._idbCache=window._idbCache||{};
window._idbReady=new Promise(res=>{window._idbReadyResolve=res;}); // 起動時の IndexedDB 退避データ読込の完了（true=成功 / false=失敗）
window._ssFailures=window._ssFailures||[];
const SS = (key, val) => { try { localStorage.setItem('dist_'+key, JSON.stringify(val)); } catch (e) { window._ssFailures.push(key); try{window._idbCache=window._idbCache||{};window._idbCache[key]=val;}catch(e3){} try{_idbSet('lsov_dist_'+key,val).catch(function(){});}catch(e2){} console.warn('localStorage容量超過→拡張領域へ退避:', key); } };

let state = {
  products: LS('inv_products') || [],
  unlisted: LS('inv_unlisted') || [],
  removed: LS('inv_removed') || [],
  amazon_fba: LS('inv_amazon_fba') || LS('inv_amazon') || [],
  amazon_self: LS('inv_amazon_self') || [],
  mercari: LS('inv_mercari') || [],
  mercariFiles: LS('inv_mercari_files') || 0,
  yahoo: LS('inv_yahoo') || [],
  returns: LS('inv_returns') || [],
  nai: LS('inv_nai') || {},
  // Sales data
  sales_priceter: LS('inv_sales_priceter') || [],
  sales_mercari: LS('inv_sales_mercari') || [],
  sales_yahoo: LS('inv_sales_yahoo') || [],
  mercari_orders: LS('inv_mercari_orders') || [],
  // Fee settings
  yahooOrderTimes: LS('inv_yahoo_ots') || {},
  mePreOverrides: LS('inv_mepre_ov') || {},
  costFix: LS('inv_costfix') || {}, // 手修正した原価（取引キー→{c:単価,p:利益上書き,at}）: 再取込・再集計・月次保存でも優先
  dupDecisions: LS('inv_dupdec') || {},
  mdCancelConf: LS('inv_mdcancel') || {}, // メルカリShops キャンセルの確認結果（在庫へ戻すか・受領日・数量）: 再取込・再起動でも保持
  meSkuFix: LS('inv_meskufix') || {}, // メルカリShops 売上行へのSKU手入力（注文番号＋明細番号）
  mePreCxRes: LS('inv_mepre_cx') || {}, // 発送前仮行の「取消の対応先」確認結果（注文番号＋商品行キー → this: 今回の購入の取消／prior: 前の購入の取消） // 重複確認の結果（取引キー→'dup'|'ok'）: 再取込でも保持
  mercariShopsAd: LS('inv_ms_ad') || 0,
  feesMonthly: LS('inv_fees_monthly') || {},
  feesYM: LS('inv_fees_ym') || null,
  feesSet: LS('inv_fees_set') || {}, // 基準月の広告費・クーポン負担を利用者が入力済みか（未入力と確認済み0円の区別）
  yahoo_fees: LS('inv_yahoo_fees') || {commission:6.5,pr_ad:0,coupons:[]},
  rakuma_fees: (()=>{const v=LS('inv_rakuma_fees');return (v&&parseFloat(v.commission)>0)?v:{commission:10};})(), // ラクマ手数料は既定10%（毎月引き継ぎ）
  auction_fees: LS('inv_auction_fees') || {commission:7.7,pr_ad:0,high_price_rate:0,high_price_threshold:0,high_price_target:0,coupons:[]},
  // Pending shipping (納品中)
  pendingShip: LS('inv_pending') || {},
  _manualPending: LS('inv_manual_pending') || [],
  sales_yafuoku: LS('inv_sales_yafuoku') || [],
  sales_mercari_direct: LS('inv_sales_mercari_direct') || [],
  sales_rakuma: LS('inv_sales_rakuma') || [],
  customChannels: LS('inv_custom_channels') || [],
  sales_custom: LS('inv_sales_custom') || {},
  colorConfig: LS('inv_color_config') || {normal:{white:1},titles:{}},
  _detectedColors: LS('inv_detected_colors') || {},
  _noSkuWarnings: LS('inv_nosku_warn') || [],
  openingInv: LS('inv_opening_inv') || null,
  expenses: LS('inv_expenses') || {fixed:[],monthly:{}},
  creditCards: LS('inv_credit_cards') || [],
  loans: LS('inv_loans') || [],
  enabledChannels: LS('inv_enabled_channels') || null,
  setupDone: LS('inv_setup_done') || {},
  monthlyTasks: LS('inv_monthly_tasks') || {},
  bulkImported: LS('inv_bulk_imported') || {},
  expenseAccounts: LS('inv_exp_accounts') || {fixed:['地代家賃','通信費','ツール・サブスク代','水道光熱費','保険料','給料・外注費（固定）','役員報酬','減価償却費','車両費'],variable:['荷造運賃','旅費交通費','消耗品費','給料・外注費（変動）','通信費','広告宣伝費','支払手数料'],other:['接待交際費','新聞図書費','研修費','修繕費','租税公課','雑費']},
  reimbursements: LS('inv_reimb') || [],

function cleanVal(v) {
  let s = (v||'').trim();
  // Handle ="value" format (full, before quote stripping)
  if (s.startsWith('="') && s.endsWith('"')) return s.slice(2, -1).trim();
  if (s.startsWith("='") && s.endsWith("'")) return s.slice(2, -1).trim();
  // Handle =value format (after CSV parser already stripped quotes)
  if (s.startsWith('=')) s = s.slice(1);
  // Strip remaining surrounding quotes
  s = s.replace(/^"|"$/g, '');
  return s.trim();
}

// Proper CSV parser handling multiline quoted fields (for Mercari Shops etc.)
function parseCSV(text) {
  const rows = [];
  let i = 0, len = text.length;
  function parseField() {
    if (i >= len) return '';
    if (text[i] === '"') {
      i++; let val = '';
      while (i < len) {
        if (text[i] === '"') { if (i+1<len && text[i+1] === '"') { val+='"'; i+=2; } else { i++; break; } }
        else { val += text[i]; i++; }
      }
      return val;
    }
    let val = '';
    while (i<len && text[i]!==',' && text[i]!=='\n' && text[i]!=='\r') { val+=text[i]; i++; }
    return val;
  }
  function parseRow() {
    const fields = [];
    while (i < len) {
      fields.push(cleanVal(parseField()));
      if (i<len && text[i]===',') { i++; continue; }
      if (i<len && text[i]==='\r') i++;
      if (i<len && text[i]==='\n') i++;
      break;
    }
    return fields;
  }
  const headers = parseRow();
  if (!headers.length || !headers[0]) return [];
  while (i < len) {
    if (text.slice(i, i+10).trim() === '') break;
    const fields = parseRow();
    if (!fields.length || (fields.length===1 && !fields[0])) continue;
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = fields[idx] || ''; });
    rows.push(obj);
  }
  return rows;
}

function parseTSV(text) {
  const ls = text.split(/\r?\n/).filter(l => l.trim());
  if (!ls.length) return { headers:[], rows:[] };
  const d = (ls[0].match(/\t/g)||[]).length >= (ls[0].match(/,/g)||[]).length ? '\t' : ',';
  const sp = l => {
    if (d==='\t') return l.split('\t').map(c=>c.trim().replace(/^"|"$/g,''));
    const v=[]; let c='',q=false;
    for(let i=0;i<l.length;i++){if(l[i]==='"')q=!q;else if(l[i]===','&&!q){v.push(c.trim());c='';}else c+=l[i];}
    v.push(c.trim()); return v;
  };
  return { headers: sp(ls[0]), rows: ls.slice(1).map(l=>sp(l)).filter(r=>r.some(c=>c)) };
}

function parseDate(s) {
  if (!s) return null;
  const str = String(s).trim();
  // 2024/05/12, 2024-05-12, 2024.05.12, 20240512
  let m = str.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = str.match(/^(\d{8})$/);
  if (m) return new Date(+str.slice(0,4), +str.slice(4,6)-1, +str.slice(6,8));
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}
// Format date string to YYYY/MM/DD
function fmtDate(dateStr){
  if(!dateStr)return'—';
  const s=String(dateStr).trim();
  // Already YYYY/MM/DD or YYYY-MM-DD
  let m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return m[1]+'/'+m[2].padStart(2,'0')+'/'+m[3].padStart(2,'0');
  // 和暦風 "2026年8月23日"（メルカリShops注文データの purchase_date など）
  m=s.match(/^(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
  if(m)return m[1]+'/'+m[2].padStart(2,'0')+'/'+m[3].padStart(2,'0');
  // "Mon DD YYYY" or "Day Mon DD YYYY HH:MM..." pattern
  const months={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  m=s.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+(\d{1,2})[\s,]+(\d{4})/i);
  if(m)return m[3]+'/'+months[m[1].slice(0,3).toLowerCase()]+'/'+m[2].padStart(2,'0');
  // Fallback
  const d=new Date(s);
  if(!isNaN(d.getTime())){
    // Use local timezone methods
    const y=d.getFullYear();const mo=d.getMonth()+1;const day=d.getDate();
    return y+'/'+(mo<10?'0':'')+mo+'/'+(day<10?'0':'')+day;
  }
  return s.slice(0,10);
}

function calcAgeDays(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return -1;
  const now = new Date(); now.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return Math.floor((now - d) / 86400000);
}
function formatAge(days) {
  if (days < 0) return '—';
  if (days < 30) return days + '日';
  if (days < 365) return Math.floor(days/30) + 'ヶ月' + (days%30>0 ? days%30+'日' : '');
  return Math.floor(days/365) + '年' + (Math.floor((days%365)/30)>0 ? Math.floor((days%365)/30)+'ヶ月' : '');
}
function ageBadgeColor(days) {
  if (days < 0) return 'background:#f3f8ff;color:var(--muted)';
  if (days < 30) return 'background:#f3f8ff;color:var(--muted)';
  if (days < 60) return 'background:var(--ok-bg);color:var(--ok)';
  if (days < 90) return 'background:var(--warn-bg);color:var(--warn)';
  return 'background:var(--danger-bg);color:var(--danger)';
}

// ── Mercari Shops CSV special parser ──
function parseMercariCSV(rows){
  // Mercari exports one row per product with SKU1-SKU10 columns
  // Only status=2 (出品中) items are active inventory
  const result = [];
  rows.forEach(row => {
    const status = (row['商品ステータス']||'').trim();
    if(status !== '2') return; // Skip non-active products
    const name = row['商品名'] || '';
    const price = parseInt((row['販売価格']||'0').replace(/[,¥]/g,''),10)||0;
    let found = false;
    for(let n=1; n<=10; n++){
      const code = (row[`SKU${n}_商品管理コード`]||'').trim();
      const qty = parseInt(row[`SKU${n}_現在の在庫数`]||'0',10)||0;
      if(code && qty > 0){
        result.push({SKU:code, title:name, number:String(qty), price:String(price)});
        found = true;
      }
    }
  });
  return result;
}

  // Pending ship items: products in pendingShip but not in any platform CSV
  const pendingEntries=[];
  Object.keys(state.pendingShip).forEach(sku=>{
    if(!state.pendingShip[sku])return;
    // Skip if already in listed
    if(listed.find(i=>i.sku===sku))return;
    // Find in products
    const pe=state.products.find(p=>p.sku===sku);
    // Or in manual pending
    const mp=(state._manualPending||[]).find(m=>m.sku===sku);
    const src=pe||mp;
    if(!src)return;
    if(pe&&_invFutureCnt(pe)>=(parseInt(pe.purchaseQty||1,10)||1))return; // 翌月以降の仕入は対象外
    if(!pe&&mp&&mp.ym){const _p=String(mp.ym).split('-');if(_p.length===2&&(parseInt(_p[0],10)*100+parseInt(_p[1],10))>(state.selectedYear*100+state.selectedMonth))return;}
    const age=calcAgeDays(src.date||'');
    pendingEntries.push({sku,name:src.name||'',qty:1,price:src.price||0,platforms:['pending'],inAmazon:false,isNonAmazon:false,included:false,cost:src.cost||0,costs:[src.cost||0],purchaseQty:src.purchaseQty||1,supplier:src.supplier||'',maker:src.maker||'',asin:src.asin||'',mQty:0,yQty:0,rQty:0,isUnlisted:false,isPending:true,purchaseDate:src.date||'',ageDays:age});
  });

  // 手動追加（独立した区分 'manual_add'）: 計上開始月（ym）以降の基準月で計上。翌月以降の仕入は既存ルールで計上外。
  // 販売による減算: 同SKUの有効な販売（計上開始月〜基準月）を登録数量から差し引く。適用した販売は記録（applied: 注文|SKU#連番 → 販売日・数量・売上額・明細番号）に残し、再取込・再起動・CSV差し替え・一括削除後も同じ販売を二度引かず、販売済み在庫も復活しない。
  // 適用済み記録の再判定（毎回）: 同じ注文|SKU の今の明細と _miMatchLines で対応付け（明細番号→内容→1対1。並び順では決めない）。対応した明細の販売日（対象月）・数量の訂正は反映。
  //   対応する明細が無い記録: 同じ注文の別SKUに同じ内容（明細番号 or 販売日・数量・売上額）の未対応明細があれば SKU訂正として減算を外す。注文が見えているだけでは削除と断定せず要確認（翌月CSVに注文の一部だけが載る場合があるため）。注文自体が見えない（CSV差し替え）なら記録を保持。
  //   対応が特定できない（同じ注文|SKUに複数明細・複数記録で内容が一致しない）記録は変更せず要確認。取消・返金（注文|SKU単位・数量付き）は残数を自動では戻さず、利用者が「再判定」で戻す数量を確定するまで残数を変えない。
  // 同SKUが他区分（在庫CSV・納品中・未出品・返品／キャンセル戻り）で計上されていれば、残数のうちその数量分は重複として計上しない（記録は残す。「別個体」の確認で全数）。
  const manualItems=[];const manualInfo=[];
  try{const _sel=state.selectedYear*100+state.selectedMonth;const _others=[...listed,...pendingEntries,...ul];
    const _list=(state.manualInv||[]).filter(m=>m&&m.id);const _persist=!window._dryRun;let _dirty=false;const _now=new Date().toISOString();
    const _idx=_list.length?_manualSalesIndex():{sales:{},byBase:{},invalid:{},orders:{}};
    const _ymv=s=>{const p=String(s||'').split('-');return p.length===2?(parseInt(p[0],10)*100+parseInt(p[1],10)):0;};
    const effQ=x=>Math.max(0,(parseInt(x.qty,10)||0)-(parseInt(x.restored,10)||0));
    const baseOf=k=>k.replace(/#[^#]*$/,'');
    const work=new Map(),logs=new Map();
    _list.forEach(m=>{const sku=String(m.sku||'').trim();let ap=m.applied||{};
      // 旧形式のキー（51版: 行番号なし／販路|注文番号 のみ）を新形式へ
      Object.keys(ap).forEach(k=>{if(k.indexOf('#')>=0)return;const p=k.split('|');const nk=(p.length===2?(k+'|'+sku):k)+'#1';ap[nk]=ap[k];delete ap[k];if(_persist)_dirty=true;});
      if(_persist){m.applied=ap;}else{ap=JSON.parse(JSON.stringify(ap));}work.set(m.id,ap);logs.set(m.id,[]);});
    const bySku={};_list.forEach(m=>{const k=String(m.sku||'').trim();(bySku[k]=bySku[k]||[]).push(m);});
    const entsOf={};Object.keys(bySku).forEach(sku=>{entsOf[sku]=bySku[sku].slice().sort((a,b)=>(_ymv(a.ym)-_ymv(b.ym))||String(a.at||'').localeCompare(String(b.at||'')));});
    const fullInvalid=b=>{const iv=_idx.invalid[b];if(!iv||iv.qty<=0)return false;if(iv.unknown>0)return false;const tot=(_idx.byBase[b]||[]).reduce((s,l)=>s+l.qty+(l.cx||0),0);return iv.qty>=tot;};
    const recState=new Map(); // 記録 → 'ok'（今の明細と数量が一致）／'cxmis'（取消で明細の数量が減り、記録と不一致）／'unmatched'
    const invText=iv=>iv.unknown>0?('（取消数量が不明'+(iv.qty>0?'・判明分 '+iv.qty+'個':'')+'。保存明細の販売個数0など数量が取得できない取消があります）'):'';
    // ① 記録と明細の対応付け（基底キーごと）
    const recsByBase={};_list.forEach(m=>{const ap=work.get(m.id);Object.keys(ap).forEach(k=>{const x=ap[k];delete x.missing;(recsByBase[baseOf(k)]=recsByBase[baseOf(k)]||[]).push({m,k,x});});});
    const usedLine=new Set(),heldLine=new Set();const unmatched=[];
    Object.keys(recsByBase).forEach(base=>{const recs=recsByBase[base];const lines=(_idx.byBase[base]||[]);const sku=String(recs[0].m.sku||'').trim();
      const mm=_miMatchLines(recs,lines);
      mm.pairs.forEach(([r,l])=>{usedLine.add(l);const x=r.x;x.lid=l.lid||x.lid||'';x.sales=l.sales;
        if((l.cx||l.rcx)&&l.qty!==(parseInt(x.qty,10)||0)){recState.set(x,'cxmis');return;} // 一部取消で有効数量が減った明細: 自動では数量を変えず、再判定で戻す数量を確定する
        recState.set(x,'ok');
        if(l.date!==x.date||l.ym!==x.ym||l.qty!==(parseInt(x.qty,10)||0)){const before={date:x.date,ym:x.ym,qty:x.qty};
          if(_ymv(l.ym)<_ymv(r.m.ym)){delete work.get(r.m.id)[r.k];logs.get(r.m.id).push({kind:'unapply',key:r.k,why:'date_before_start',before,after:{date:l.date,ym:l.ym,qty:l.qty}});return;}
          x.date=l.date;x.ym=l.ym;x.qty=l.qty;if((x.restored||0)>l.qty)x.restored=l.qty;x.at2=_now;logs.get(r.m.id).push({kind:'fix',key:r.k,before,after:{date:l.date,ym:l.ym,qty:l.qty}});}});
      if(mm.ambiguous){mm.recsLeft.forEach(r=>{r.x.missing='ambig';recState.set(r.x,'unmatched');});mm.linesLeft.forEach(l=>heldLine.add(l));return;}
      mm.recsLeft.forEach(r=>{recState.set(r.x,'unmatched');unmatched.push(r);});});
    // ② 対応する明細が無い記録: SKU訂正の特定 ／ 要確認 ／ 保持
    unmatched.forEach(r=>{const x=r.x;const base=baseOf(r.k);const okey=base.replace(/\|[^|]*$/,'');const sku=String(r.m.sku||'').trim();
      if(_idx.invalid[base])return; // 取消・返金: 利用者の再判定待ち
      if(!_idx.orders[okey])return; // 注文自体が見えない（CSV差し替え・一括削除）: 記録を保持
      if(okey.indexOf('|~')>=0){x.missing='visible';return;} // 注文番号なし（仮の注文キー）: 別の販売かSKU訂正かを自動では判定しない
      const cand=Object.keys(_idx.byBase).filter(b=>b.indexOf(okey+'|')===0&&b!==base).reduce((a,b)=>a.concat(_idx.byBase[b]),[]).filter(l=>!usedLine.has(l)&&!heldLine.has(l)&&((x.lid&&l.lid===x.lid)||(l.date===x.date&&l.qty===(parseInt(x.qty,10)||0)&&(x.sales===undefined||l.sales===x.sales))));
      if(cand.length===1){delete work.get(r.m.id)[r.k];logs.get(r.m.id).push({kind:'unapply',key:r.k,why:'sku',before:x,to:cand[0].sku});return;}
      x.missing='visible';});
    // ③ 未適用の明細を割り当て（販売日順。計上開始月〜販売月に残数がある登録へ。同じ明細は1件にだけ）
    const unappliedBySku={};
    Object.keys(entsOf).forEach(sku=>{const ents=entsOf[sku];
      const remAsOf=(m,ymv)=>{const q=parseInt(m.qty,10)||0;let a=0;Object.values(work.get(m.id)).forEach(x=>{if(_ymv(x.ym)<=ymv)a+=effQ(x);});return q-a;};
      const nextN=base=>{let n=0;ents.forEach(m=>Object.keys(work.get(m.id)).forEach(k=>{if(baseOf(k)===base){const v=parseInt(k.slice(k.lastIndexOf('#')+1),10)||0;if(v>n)n=v;}}));return n+1;};
      const cands=(sku?(_idx.sales[sku]||[]):[]).filter(l=>!usedLine.has(l)&&!heldLine.has(l)&&!fullInvalid(l.base)).sort((a,b)=>a.date.localeCompare(b.date)||a.lid.localeCompare(b.lid)||(a.qty-b.qty));
      const un=[];cands.forEach(s=>{const sv=_ymv(s.ym);const cand=ents.filter(m=>_ymv(m.ym)>0&&_ymv(m.ym)<=sv&&remAsOf(m,sv)>0);
        if(!cand.length){if(ents.some(m=>_ymv(m.ym)>0&&_ymv(m.ym)<=sv))un.push(s);return;}
        const m=cand[0];const rem=remAsOf(m,sv);const useQ=Math.min(rem,s.qty);const k=s.base+'#'+nextN(s.base);work.get(m.id)[k]={qty:useQ,date:s.date,ym:s.ym,pf:s.pf,oid:s.oid,lid:s.lid||'',sales:s.sales,at:_now};if(s.cx)work.get(m.id)[k].cx=s.cx;recState.set(work.get(m.id)[k],'ok');usedLine.add(s);logs.get(m.id).push({kind:'apply',key:k,qty:useQ,date:s.date});
        if(s.qty>useQ)un.push(Object.assign({},s,{qty:s.qty-useQ}));});
      unappliedBySku[sku]=un;});
    _list.forEach(m=>{const lg=logs.get(m.id);if(lg.length&&_persist){_dirty=true;m.hist=m.hist||[];lg.forEach(l=>m.hist.push(Object.assign({at:_now},l)));}});
    // ④ 表示・計上
    Object.keys(entsOf).forEach(sku=>{const ents=entsOf[sku];const unapplied=unappliedBySku[sku]||[];
      ents.forEach((m,ei)=>{const q=parseInt(m.qty,10)||0;const applied=work.get(m.id);const info={id:m.id,sku,qty:q,eff:0,other:0,sources:[],state:'',note:'',applied:0,remaining:q,appliedList:[],attn:[],changes:logs.get(m.id)};manualInfo.push(info);
        const ymv=_ymv(m.ym);const pe=sku?(state.products.find(p=>p.sku===sku)||null):null;const v=_manualInvView(m,pe);info.view=v;info.noProduct=!pe;info.from=m.from||null;
        if(!pe)info.attn.push({code:'nosku',msg:'同期している仕入管理表の取込済みデータにSKUが見つかりません（入力間違い、または仕入管理表の未同期を確認）'});
        _others.forEach(it=>{if(!sku||it.sku!==sku)return;const oq=Math.max(it.qty||0,it.mQty||0,it.yQty||0)+(it.rQty||0);if(oq<=0)return;info.other+=oq;info.sources.push((it.isUnlisted?'未出品':it.isPending?'納品中':(it.platforms||[]).map(p=>PL[p]||p).join('/'))+' '+oq+'個');if((it.rQty||0)>0||(it.platforms||[]).includes('refund_back'))info.returnBack=(info.returnBack||0)+((it.rQty||0)||Math.max(it.qty||0,0));});
        Object.keys(applied).forEach(k=>{const x=applied[k];const inRange=_ymv(x.ym)<=_sel;const base=baseOf(k);const iv=_idx.invalid[base];const full=iv?fullInvalid(base):false;
          info.appliedList.push(Object.assign({key:k,inRange,eff:effQ(x),cancelled:!!iv,resolved:!!x.resolved},x));if(inRange)info.applied+=effQ(x);
          const lbl='減算に使った販売（'+(x.date||'')+'・'+(x.qty||0)+'個・'+(x.oid||k)+(x.lid&&x.lid!==x.oid?'・明細'+x.lid:'')+'）';
          const _cxAttn=!!iv&&!x.resolved&&(recState.get(x)!=='ok'||(iv.qty>0&&!iv.single)||iv.unknown>0);info.appliedList[info.appliedList.length-1].cancelAttn=_cxAttn;
          if(_cxAttn){info.attn.push({code:'cancelled',key:k,msg:lbl+'が'+iv.reason+'になっています'+(iv.unknown>0?invText(iv):(full?'':'（この注文・SKUのうち '+(iv.qty+iv.refl)+'個が'+iv.reason+(recState.get(x)==='cxmis'?'':'。どの明細かは特定できません')+'）'))+'。既存の返品戻し'+(info.returnBack?'（この月に '+info.returnBack+'個計上済み）':'（この月の計上なし）')+'と二重にならないよう、残数は自動では戻しません。「再判定」で戻す数量を確定してください'});return;}
          if(!iv&&x.resolved&&(parseInt(x.restored,10)||0)>0){info.attn.push({code:'revived',key:k,msg:'戻した販売（'+(x.oid||k)+'・戻し '+x.restored+'個）が再び有効な販売になっています。「再判定」で戻す数量を確定し直してください'});return;}
          if(x.missing==='visible'){info.attn.push({code:'missing',key:k,msg:lbl+'の明細が今のデータに見つかりません（同じ注文は見えています）。翌月CSVに注文の一部だけが載っている場合は変更不要です。SKU訂正や行削除で無くなった明細なら「再判定」で減算を外してください'});}
          else if(x.missing==='ambig'){info.attn.push({code:'ambig_line',key:k,msg:lbl+'は、同じ注文・SKUに明細が複数あり訂正後の対応を特定できません（記録は変更していません）。残数を確認し、必要なら「再判定」で記録を外して現在の明細で引き直してください'});}});
        info.remaining=Math.max(0,q-info.applied);if(info.applied>q)info.attn.push({code:'over',msg:'販売数量（'+info.applied+'個）が登録数量（'+q+'個）を超えています。登録数量を確認してください'});
        if(ei===ents.length-1&&unapplied.length){const uq=unapplied.reduce((s,x)=>s+x.qty,0);info.attn.push({code:'over',msg:'登録数量を超える販売が '+unapplied.length+'件（'+uq+'個: '+unapplied.map(x=>x.date+' '+(x.oid||'')).join('・')+'）あり、減算できません。実際の保有数と登録数量を確認してください'});}
        if(m.dupOk&&info.applied>0)info.attn.push({code:'ambig',msg:'「別個体として全数計上」の行に販売（'+info.applied+'個）があります。販売が手動登録分か他区分'+(info.other>0?'（'+info.sources.join('・')+'）':'（在庫CSVなど）')+'の在庫かを自動では区別できません。残数と他区分の数量を確認してください'});
        const sig=JSON.stringify(info.attn.map(a=>a.code+'|'+(a.key||'')+'|'+a.msg));info.attnSig=sig;info.acked=!!(m.ack&&m.ack.sig===sig);info.needCheck=info.attn.length>0&&!info.acked;
        if(q<=0){info.state='qty0';return;}
        if(ymv>_sel){info.state='before';info.note=String(m.ym||'')+' から計上';return;}
        if(pe){const pi=_invPurchaseInfo(pe);info.purchase=pi;if(pi.kind==='future'){info.state='future';info.note=pi.label;return;}}
        if(info.remaining<=0){info.state='sold';return;}
        const eff=m.dupOk?info.remaining:Math.max(0,info.remaining-info.other);info.eff=eff;
        if(eff<=0){info.state='dup';return;}
        info.state='counted';
        const cost=(typeof v.cost==='number')?v.cost:0;
        manualItems.push({sku,name:v.name||'',qty:eff,price:v.price||0,platforms:['manual_add'],inAmazon:false,isNonAmazon:false,included:false,cost,costs:[cost],purchaseQty:pe?(parseInt(pe.purchaseQty||1,10)||1):q,supplier:v.supplier||'',maker:pe?(pe.maker||''):'',asin:pe?(pe.asin||''):'',mQty:0,yQty:0,rQty:0,isUnlisted:false,isPending:false,isManualAdd:true,_manual:{id:m.id,reason:m.reason||'',note:m.note||'',qty:q,applied:info.applied,remaining:info.remaining,other:info.other,sources:info.sources.slice(),dupOk:!!m.dupOk,noProduct:!pe,attn:info.attn.length},purchaseDate:v.date||'',ageDays:calcAgeDays(v.date||'')});});
    });
    if(_dirty&&!window._miSaveT){window._miSaveT=setTimeout(()=>{window._miSaveT=null;try{save();}catch(e){}},0);}
  }catch(e){}
  return { items, finalInv:[...listed,...pendingEntries,...ul,...manualItems], nonAmz:items.filter(i=>i.isNonAmazon), allPS, colorWarnings, futureOnly, manualItems, manualInfo };
}

function badgeHTML(p) {
  return `<span class="badge ${p}">${PL[p]||p}</span>`;
}
function uBadge() { return '<span class="badge unlisted">未出品</span>'; }

// Banner: only for sync completion and errors (dismissible with ×)
function showBanner(msg, type='info') {
  const container=document.getElementById('banner-area');
  if(!container)return;
  const id='ban_'+Date.now();
  const colors={ok:'background:var(--ok-bg);border-color:#b2dfc8;color:var(--ok)',err:'background:var(--danger-bg);border-color:#f0c8c8;color:var(--danger)',info:'background:var(--blue-soft);border-color:var(--blue);color:var(--blue-deep)'};
  const div=document.createElement('div');
  div.id=id;div.style.cssText='padding:12px 18px;border-radius:12px;border:1px solid;margin-bottom:8px;font-size:13px;display:flex;align-items:center;gap:10px;'+colors[type];
  div.innerHTML=`<div style="flex:1">${esc(msg)}</div><button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:inherit;padding:0 4px">×</button>`;
  container.prepend(div);
  if(type==='ok')setTimeout(()=>{const el=document.getElementById(id);if(el)el.remove();},10000);
}
// Quiet alert: used for non-critical actions (no visible banner)
function showAlert(msg, type='info') {
  if(type==='err')showBanner(msg,type);
  // OK and info → silent (no banner)
}

        html+=`<div id="color-guide" style="display:none;padding:12px;background:#fffbea;border:1px solid #f0d890;border-radius:10px;margin-bottom:10px;font-size:11px;line-height:1.8">
<b>STEP1: 出品後在庫の色を選択</b><br>
・出品済み商品（SKU入力済み）のNo.列セルの背景色にチェック（複数可・通常は白のみでOK）<br>
・チェックした色＋SKUあり → 出品済み商品として商品マスタへ<br>
・チェックした色＋SKUなし＋商品名あり → ダッシュボードに⚠警告（SKU入力漏れの検知）<br>
・商品名なしの行 → 無視<br><br>
<b>STEP2: 未出品在庫の色分類（タイトル入力・任意）</b><br>
・STEP1でチェックしなかった色は未出品在庫として取り込まれる（SKU有無問わず）<br>
・各色に意味を入力（例: 納品前・未検品・会社備品）→ 未出品在庫ページのラベル・フィルターに表示<br>
・未入力の色は「🎨 黄色」のように色名で表示<br>
・設定変更後は「全シート同期」を再実行して反映</div>`;
        html+=`<p class="desc" style="margin:0 0 10px;font-size:11px">出品済み商品（SKU入力済み）のセル背景色をチェックしてください（複数可・通常は白のみ）。件数は商品名またはSKUが入力されている行のみカウントしています。</p>`;
        html+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">`;
        detKeys.forEach(k=>{html+=chipHtml(k,true);});
        html+=`</div>`;
        html+=`<button class="btn primary" style="padding:6px 18px" onclick="saveColorStep(1)">💾 保存</button>`;
        html+=`</div>`;
      } else {
        html+=`<div class="card section" style="padding:14px 18px"><div class="flex-between"><div class="flex" style="gap:8px;align-items:center;flex-wrap:wrap"><h3 style="font-size:13px;margin:0">✔ 出品後在庫の色:</h3>`;
        const normKeys=detKeys.filter(k=>norm[k]);
        if(normKeys.length>0){normKeys.forEach(k=>{html+=chipHtml(k,false);});}
        else html+=`<span style="font-size:11px;color:var(--muted)">未選択</span>`;
        html+=`</div><button class="btn ghost" style="font-size:11px;padding:4px 10px" onclick="state._c1Open=true;renderAll()">✏ 変更</button></div></div>`;
      }
      // ── STEP2: 未出品在庫の色分類（STEP1保存後に表示） ──
      {
        const restKeys=detKeys.filter(k=>!norm[k]);
        if(restKeys.length>0){
          if(c2Open){
            html+=`<div class="card section"><div class="flex-between" style="margin-bottom:6px"><h3 style="font-size:14px;margin:0">🎨 未出品在庫の色分類</h3><span style="font-size:11px;color:var(--muted)">出品後在庫で選択されていない色</span></div>`;
            html+=`<p class="desc" style="margin:0 0 10px;font-size:11px">これらの色は未出品在庫として取り込まれます。タイトルを入力するとその名前でフィルター・表示されます（未入力なら色名で表示）。</p>`;
            html+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-bottom:12px">`;
            restKeys.forEach(k=>{
              const info=COLOR_KEYS[k]||{name:k,swatch:'#ccc'};
              const cnt=state._detectedColors[k]||0;
              const title=(state.colorConfig.titles&&state.colorConfig.titles[k])||'';
              html+=`<div style="display:flex;align-items:center;gap:8px;padding:9px;background:#fff;border:1px solid var(--line);border-radius:9px">`;
              html+=`<span style="width:20px;height:20px;border-radius:5px;background:${info.swatch};border:1px solid rgba(0,0,0,.18);flex-shrink:0"></span>`;
              html+=`<div style="min-width:64px"><div style="font-size:11px;font-weight:700">${info.name}</div><div style="font-size:10px;color:var(--muted)">${cnt}件</div></div>`;
              html+=`<input type="text" value="${esc(title)}" placeholder="タイトル（例: 納品前）" onchange="updateColorTitle('${k}',this.value)" style="flex:1;min-width:80px;font-size:11px;padding:5px 8px">`;
              html+=`</div>`;
            });
            html+=`</div>`;
            html+=`<div class="flex" style="gap:10px;align-items:center"><button class="btn primary" style="padding:6px 18px" onclick="saveColorStep(2)">💾 保存</button><span class="note" style="font-size:11px;margin:0">設定変更後は「全シート同期」を再実行すると分類に反映されます</span></div>`;
            html+=`</div>`;
          } else {
            html+=`<div class="card section" style="padding:14px 18px"><div class="flex-between"><div class="flex" style="gap:8px;align-items:center;flex-wrap:wrap"><h3 style="font-size:13px;margin:0">🎨 未出品在庫の色分類:</h3>`;
            restKeys.forEach(k=>{
              const info=COLOR_KEYS[k]||{name:k,swatch:'#ccc'};
              const title=(state.colorConfig.titles&&state.colorConfig.titles[k])||'';
              html+=`<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:11px"><span style="width:13px;height:13px;border-radius:3px;background:${info.swatch};border:1px solid rgba(0,0,0,.18)"></span>${title?esc(title):info.name}</span>`;
            });
            html+=`</div><button class="btn ghost" style="font-size:11px;padding:4px 10px" onclick="state._c2Open=true;renderAll()">✏ 変更</button></div></div>`;
          }
        }
      }
    }
  }

  { // 接続済みシートは常時表示
    // GAS URL setup
    if(!state.gasUrl){
      html+=`<div style="padding:16px;border-radius:12px;border:2px solid var(--blue);background:var(--blue-soft);margin-bottom:16px"><div style="font-size:14px;font-weight:700;color:var(--blue-deep);margin-bottom:6px">🔧 スプレッドシートが未連携です</div><div style="font-size:12px;color:var(--muted);margin-bottom:10px">初回連携（GAS設定とURL登録）を済ませると、このページで同期できるようになります。</div><button class="btn primary" onclick="showPage('sheetsetup')">📖 初回連携ページを開く</button></div>`;
    } else {
      // GAS connected indicator
      html+=`<div style="display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;border:1px solid #b2dfc8;background:var(--ok-bg);margin-bottom:16px"><span class="connected-dot"></span><div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--ok)">Apps Script 接続済み（トークン認証）</div><div style="font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(state.gasUrl).slice(0,60)}...</div></div><button class="btn ghost" style="padding:5px 10px;font-size:11px" onclick="testGas()">テスト接続</button><button class="btn ghost" style="padding:5px 10px;font-size:11px" onclick="if(confirm('Apps Scriptの設定をリセットしますか？')){state.gasUrl='';state.gasToken='';save();renderAll();}">変更</button></div>`;

      // Connected sheets list
      if(state.sheets.length>0){
        html+=`<div class="flex-between" style="margin-bottom:14px"><div style="font-size:14px;font-weight:700">接続済みシート（${state.sheets.length}件）</div><button class="btn primary" id="sync-all-btn" onclick="doSync()" ${_syncRunning?'disabled':''}>${_syncRunning?'<span class="spinner"></span> 同期中...':'🔄 全シート同期'}</button></div>`;
        state.sheets.forEach(sh=>{
          html+=`<div style="padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:#fff;margin-bottom:10px;display:flex;align-items:center;gap:12px">`;
          html+=`<span class="connected-dot"></span>`;
          html+=`<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sh.name)}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">ID: ${esc(sh.ssId?.slice(0,20))}... / シート名: ${esc(sh.tab)} / ヘッダー: ${sh.headerRow||1}行目${sh.maxRows?` / 最大${sh.maxRows}行`:''}</div>${sh._lastCount!==undefined?`<div style="font-size:11px;color:var(--ok);margin-top:2px">最終同期: ${sh._lastCount}行読取（SKU有: ${sh._lastSKU||0} / SKU無: ${sh._lastNoSKU||0}）</div>`:''}</div>`;
          html+=(state._sheetLoading===sh._id)?`<button class="btn ghost" style="padding:6px 12px;font-size:12px" disabled><span class="spinner"></span> 取得中…</button>`:`<button class="btn ghost" style="padding:6px 12px;font-size:12px" onclick="toggleSheetDetail('${sh._id}')">${state._expandSheet===sh._id?'閉じる':'詳細'}</button>`;
          html+=`<button class="btn danger" style="padding:6px 12px;font-size:12px" onclick="removeSheet('${sh._id}')">削除</button>`;
          html+=`</div>`;
          // Expandable detail
          if(state._expandSheet===sh._id && sh._parsed){
            const p=sh._parsed, cm=sh.colMap||{};
            let wSKU=0,woSKU=0;if(cm.sku!==undefined)p.rows.forEach(r=>{(r[cm.sku]||'').trim()?wSKU++:woSKU++;});
            html+=`<div style="padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--sky);margin-bottom:10px;margin-top:-6px">`;
            // Header row setting
            html+=`<div class="flex" style="margin-bottom:12px;gap:12px;align-items:center;flex-wrap:wrap"><label style="font-size:12px;font-weight:700;color:var(--blue-deep)">ヘッダー行</label><input type="number" value="${sh.headerRow||1}" min="1" style="width:80px;padding:6px 8px;font-size:13px;border:1px solid var(--line);border-radius:8px" onchange="updateSheetHeaderRow('${sh._id}',this.value)"><label style="font-size:12px;font-weight:700;color:var(--blue-deep)">最大行数</label><input type="number" value="${sh.maxRows||''}" min="0" placeholder="無制限" style="width:110px;padding:6px 8px;font-size:13px;border:1px solid var(--line);border-radius:8px" onchange="updateSheetMaxRows('${sh._id}',this.value)"><span style="font-size:11px;color:var(--muted)">変更すると自動で再取得されます</span></div>`;
            html+=`<div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px">${p.headers.length}列・${p.rows.length}行${cm.sku!==undefined?` — <span style="color:var(--blue-deep)">SKU有: ${wSKU}</span>${woSKU>0?` <span style="color:var(--purple)">SKUなし: ${woSKU}</span> ・ <span style="color:var(--blue-deep)">仕入ログ: ${(state.purchaseLog||[]).filter(pr=>pr.source===sh.name).length}件</span>`:''}`:''}` + '</div>';
            html+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:10px">`;
            FIELDS.forEach(f=>{
              html+=`<div><label style="font-size:10px;font-weight:700;color:${f.req?'var(--blue-deep)':'var(--muted)'};display:block;margin-bottom:3px">${f.label}${f.req?' *':''}</label>`;
              html+=`<select style="width:100%;padding:6px 8px;font-size:12px;border:1px solid var(--line);border-radius:8px" onchange="updateSheetColMap('${sh._id}','${f.key}',this.value)"><option value="">— 未割当 —</option>${!f.req?`<option value="-1" ${cm[f.key]===-1?'selected':''}>— （ハイフン固定）</option>`:'' }`;
              p.headers.forEach((h,i)=>{html+=`<option value="${i}" ${cm[f.key]===i?'selected':''}>${esc(h)}</option>`;});
              html+=`</select></div>`;
            });
            html+=`</div>`;
            if(cm.sku===undefined)html+=`<div style="padding:8px;background:var(--danger-bg);border-radius:10px;font-size:11px;color:var(--danger);margin-bottom:8px">⚠ SKUカラムの割り当てが必要です</div>`;
            if(cm.no!==undefined&&cm.no>=0)html+=`<div style="padding:8px;background:var(--ok-bg);border-radius:10px;font-size:11px;color:var(--ok);margin-bottom:8px">✓ No.カラム設定済み — 同期時にセル背景色を取得して未出品商品を自動判定します</div>`;
            else html+=`<div style="padding:8px;background:var(--blue-soft);border-radius:10px;font-size:11px;color:var(--blue-deep);margin-bottom:8px">💡 「No.」カラムを設定すると、セル背景色（会社備品・ヤフオク等）で未出品商品を自動判定できます</div>`;
            html+=`</div>`;
          }
        });
      }

      // Add new sheet form
      html+=`<div style="padding:16px;border-radius:14px;border:2px dashed var(--line);background:var(--sky);margin-top:14px">`;
      html+=`<div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px">＋ 新しいスプレッドシートを追加</div>`;
      html+=`<div class="note" style="margin-bottom:10px;padding:10px 14px;font-size:12px">スプレッドシートのURLとシートタブ名を入力してください。「ウェブに公開」は不要です。<br>列名が1行目でない場合は「ヘッダー行」を指定。行数が多い場合は「最大行数」で制限できます。</div>`;
      html+=`<div class="flex" style="gap:8px;flex-wrap:wrap"><input type="text" id="new-sheet-name" placeholder="管理名（例: 仕入表A）" style="width:150px"><input type="url" id="new-sheet-url" placeholder="スプレッドシートURL" style="flex:1;min-width:240px"><input type="text" id="new-sheet-tab" placeholder="シート名（例: 出品管理表）" style="width:160px"><input type="number" id="new-sheet-header" placeholder="ヘッダー行（例: 2）" min="1" style="width:140px"><input type="number" id="new-sheet-max" placeholder="最大行数（例: 10000）" min="0" style="width:160px"><button class="btn primary" id="add-sheet-btn" onclick="addSheet()">追加</button></div>`;
      html+=`</div>`;
    }
  }

  if(state._pasteOpen){
    html+=`<textarea id="paste-area" rows="6" placeholder="SKU&#9;商品名&#9;仕入価格&#9;販売価格&#9;仕入先\nABC-001&#9;サンプル商品A&#9;500&#9;1200&#9;○○商事" oninput="handlePasteInput()">${esc(state._rawText||'')}</textarea>`;
  }

  if(state.fetchError) html+=`<div style="padding:12px;background:var(--danger-bg);border:1px solid #f0c8c8;border-radius:14px;font-size:13px;color:var(--danger);white-space:pre-wrap;margin-top:14px">${esc(state.fetchError)}</div>`;
  if(state.syncResult){const r=state.syncResult;
    let sheetDetails='';
    if(state.sheets.length>0)sheetDetails=state.sheets.filter(s=>s._lastCount!==undefined).map(s=>`<div style="font-size:11px;color:var(--muted);margin-top:4px">📄 ${esc(s.name)}: ${s._lastCount}行読取</div>`).join('');
    // Diagnostic info
    let diagHtml='';
    if(r._diag&&r._diag.length>0){
      diagHtml='<div style="margin-top:8px;padding:10px;background:#fff;border-radius:10px;font-size:11px;font-family:monospace">';
      r._diag.forEach(d=>{
        diagHtml+=`<div style="margin-bottom:6px"><strong>${esc(d.name)}</strong> (${d.rowCount}行):<br>`;
        diagHtml+=`colMap: ${Object.entries(d.colMap).map(([k,v])=>`${k}=${v}`).join(', ')}<br>`;
        diagHtml+=`1行目: ${Object.entries(d.sample).map(([k,v])=>`<span style="color:${v?'var(--ok)':'var(--danger)'}"><b>${k}</b>="${esc(String(v).slice(0,20))}"</span>`).join(' / ')}</div>`;
      });
      diagHtml+='</div>';
    }
    html+=`<div style="padding:12px;background:var(--ok-bg);border:1px solid #b2dfc8;border-radius:14px;font-size:13px;color:var(--ok);margin-top:14px">✓ 同期完了（計 ${r.total}件）${r.unlisted>0?` / <span style="color:var(--purple)">未出品 ${r.unlisted}件</span>`:''} — ${r.sheetCount||1}シート取得${sheetDetails}${diagHtml}</div>`;}
  html+=`</div>`;

  // Paste mode column mapping
  if(state.mode==='paste'&&state.parsed&&state.parsed.rows.length>0){
    const p=state.parsed;const cm=state.colMap||{};
    let wSKU=0,woSKU=0;if(cm.sku!==undefined)p.rows.forEach(r=>{(r[cm.sku]||'').trim()?wSKU++:woSKU++;});
    html+=`<div class="card section"><h2 style="font-size:18px">カラムマッピング</h2><p class="desc">${p.headers.length}列・${p.rows.length}行${cm.sku!==undefined?` — <span style="color:var(--blue-deep)">SKU有: ${wSKU}</span>${woSKU>0?` <span style="color:var(--purple)">未出品: ${woSKU}</span>`:''}`:''}` + '</p>';
    html+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px">`;
    FIELDS.forEach(f=>{
      html+=`<div><label style="font-size:11px;font-weight:700;color:${f.req?'var(--blue-deep)':'var(--muted)'};display:block;margin-bottom:4px">${f.label}${f.req?' <span style="color:var(--danger)">*</span>':''}</label>`;
      html+=`<select style="width:100%;padding:8px 10px;font-size:13px" onchange="updateColMap('${f.key}',this.value)"><option value="">— 未割当 —</option>${!f.req?`<option value="-1" ${cm[f.key]===-1?'selected':''}>— （ハイフン固定）</option>`:''}`;
      p.headers.forEach((h,i)=>{html+=`<option value="${i}" ${cm[f.key]===i?'selected':''}>${esc(h)}${p.rows[0]?.[i]?' ('+esc(p.rows[0][i].slice(0,15))+')':''}</option>`;});
      html+=`</select></div>`;
    });
    html+=`</div>`;
    if(cm.sku===undefined)html+=`<div style="padding:10px;background:var(--danger-bg);border-radius:12px;font-size:12px;color:var(--danger);margin-bottom:10px">⚠ SKUカラムの割り当てが必要です</div>`;
    html+=`<button class="btn primary" style="margin-top:4px" onclick="doSync()" ${(cm.sku===undefined)?'disabled':''}>🔄 同期する（${p.rows.length}件）</button>`;
    html+=`</div>`;
  }

  // Products table
  html+=`<div class="card section"><div class="flex-between" style="margin-bottom:16px"><h2>同期済み商品 <span style="font-size:14px;font-weight:400;color:var(--muted)">(${state.products.length}件)</span></h2><div class="flex"><input type="search" id="prod-search" value="${esc(psRaw)}" placeholder="SKU・商品名・メーカーで検索" style="min-width:220px"><button class="btn primary" style="padding:6px 12px" onclick="renderAll()">検索</button>${state.products.length>0?'<button class="btn danger" onclick="clearProducts()">全削除</button>':''}</div></div>`;
  // 同期済み商品の一覧は「管理表同期」ページを表示しているときだけ作る（他ページの描画で5,000行超の表を毎回作らない）。表示は200件ずつ（検索は全件が対象）
  const _prodShow=state._prodShow||200;
  const fp=(state.page==='sheet')?state.products.filter(p=>p.sku.toLowerCase().includes(ps)||(p.name||'').toLowerCase().includes(ps)||(p.maker||'').toLowerCase().includes(ps)):[];
  html+=`<div class="table-wrap"><table><thead><tr><th>仕入日</th><th>SKU</th><th>メーカー</th><th>商品名</th><th>販売価格</th><th>仕入価格</th><th>仕入在庫数</th><th>ASIN</th><th>仕入先</th></tr></thead><tbody>`;
  fp.slice(0,_prodShow).forEach(p=>{
    const asinVal=(p.asin||'').trim();
    const hasAsin=asinVal&&asinVal!=='—'&&asinVal!=='-'&&asinVal!=='−'&&asinVal!=='ー'&&!/^[\-\u2010-\u2015\u2212\uFF0D]+$/.test(asinVal);
    const asinHtml=hasAsin?`<a href="https://www.amazon.co.jp/dp/${esc(asinVal)}" target="_blank" style="color:var(--blue);text-decoration:none;font-weight:600">${esc(asinVal)}</a>`:(asinVal||'—');
    const costs=p.costs||[p.cost||0];
    const costHtml=costs.length<=1?(costs[0]?'¥'+costs[0].toLocaleString():'—'):costs.map(c=>'¥'+c.toLocaleString()).join('<br>');
    const qty=p.purchaseQty||1;
    html+=`<tr><td style="font-size:12px;white-space:nowrap">${esc(p.date)||'—'}</td><td style="font-weight:700;color:var(--blue-deep);font-size:12px">${esc(p.sku)}</td><td style="font-size:12px">${esc(p.maker)||'—'}</td><td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)||'—'}</td><td>${p.price?'¥'+p.price.toLocaleString():'—'}</td><td style="font-size:12px">${costHtml}</td><td style="font-weight:700;text-align:center">${qty}</td><td style="font-size:12px">${asinHtml}</td><td style="font-size:12px">${esc(p.supplier)||'—'}</td></tr>`;
  });
  if(!fp.length&&state.page==='sheet')html+=`<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:24px">${state.products.length===0?'スプレッドシートを接続して同期してください':'該当なし'}</td></tr>`;
  html+=`</tbody></table></div>`;
  if(fp.length>_prodShow)html+=`<div class="flex" style="gap:8px;align-items:center;margin-top:10px"><span style="font-size:12px;color:var(--muted)">${_prodShow.toLocaleString()}件を表示中（該当 ${fp.length.toLocaleString()}件）</span><button class="btn ghost" style="padding:6px 12px;font-size:12px" onclick="state._prodShow=(state._prodShow||200)+500;_renderSheetPage()">さらに500件</button><button class="btn ghost" style="padding:6px 12px;font-size:12px" onclick="state._prodShow=1e9;_renderSheetPage()">すべて表示（${fp.length.toLocaleString()}件）</button></div>`;
  html+=`</div></div>`;
  return html;
}

// 借入金: 月々返済額の自動計算
function calcLoanPay(loan){
  const P=loan.principal||0, n=loan.months||1, rr=(loan.rate||0)/100/12;
  if(loan.manualPay>0)return{monthly:loan.manualPay,first:loan.manualPay,last:loan.manualPay};
  if(loan.method==='genkin'){ // 元金均等: 元金一定+残高利息（初回最大）
    const base=Math.round(P/n);
    return{monthly:base+Math.round(P*rr),first:base+Math.round(P*rr),last:base+Math.round((P-base*(n-1))*rr),genkinBase:base};
  }
  // 元利均等（デフォルト）
  if(rr===0)return{monthly:Math.round(P/n),first:Math.round(P/n),last:Math.round(P/n)};
  const m=Math.round(P*rr*Math.pow(1+rr,n)/(Math.pow(1+rr,n)-1));
  return{monthly:m,first:m,last:m};
}
// 基準月時点の返済済み回数と残高概算
function calcLoanStatus(loan){
  const n=loan.months||1, rr=(loan.rate||0)/100/12, P=loan.principal||0;
  const _sy=parseInt(loan.startY,10),_sm=parseInt(loan.startM,10);
  const elapsed=(_sy>0&&_sm>0)?Math.max(0,Math.min(n,(state.selectedYear-_sy)*12+(state.selectedMonth-_sm)+1)):0;
  const pay=calcLoanPay(loan);
  let balance;
  if(loan.method==='genkin'){
    balance=Math.max(0,P-Math.round(P/n)*elapsed);
  }else if(rr===0||loan.manualPay>0){
    balance=Math.max(0,P-pay.monthly*elapsed);
  }else{
    balance=Math.max(0,Math.round(P*Math.pow(1+rr,elapsed)-pay.monthly*(Math.pow(1+rr,elapsed)-1)/rr));
  }
  // 当月返済額
  let curPay=0;
  if(elapsed>=1&&elapsed<=n){
    if(loan.method==='genkin'&&!(loan.manualPay>0)){
      const base=Math.round(P/n);
      curPay=base+Math.round((P-base*(elapsed-1))*rr);
    }else curPay=pay.monthly;
  }
  if(!(_sy>0&&_sm>0))return{elapsed,balance,curPay,endY:'—',endM:'—'};
  const endTotal=(_sy*12+_sm-1)+n-1;
  return{elapsed,balance,curPay,endY:Math.floor(endTotal/12),endM:endTotal%12+1};
}

// 仕入個数: 月次に未保存の月は仕入ログから自動集計して補完

  if(d&&d.purchaseCount!==undefined)return d.purchaseCount||0;
  let c2=0;(state.purchaseLog||[]).forEach(r=>{const ym=_ymOf(r.date);if(ym&&ym.y===d.year&&ym.m===d.month)c2++;});
  return c2;
}
function _expCompAt(y,m){
  const sumCo=a=>(a||[]).reduce((s,e)=>s+Math.round((e.amount||0)*((e.ratio===undefined?100:e.ratio)/100)),0);
  const mk=y+'-'+m;
  const mon=(state.expenses&&state.expenses.monthly&&state.expenses.monthly[mk])||{variable:[],other:[]};
  return sumCo((state.expenses&&state.expenses.fixed)||[])+sumCo(mon.variable)+sumCo(mon.other);
}
function _loanPayAt(y,m){
  let total=0;
  (state.loans||[]).forEach(l=>{
    const n=l.months||1,rr=(l.rate||0)/100/12,P=l.principal||0;
    if(!(l.startY>0&&l.startM>0))return;
    const k=(y-l.startY)*12+(m-l.startM)+1;
    if(k<1||k>n)return;
    if(l.manualPay>0){total+=l.manualPay;return;}
    if(l.method==='genkin'){const base=Math.round(P/n);total+=base+Math.round((P-base*(k-1))*rr);return;}
    if(rr===0){total+=Math.round(P/n);return;}
    total+=Math.round(P*rr*Math.pow(1+rr,n)/(Math.pow(1+rr,n)-1));
  });
  return total;
}
function _loanInterestAt(y,m){
  let t=0;(state.loans||[]).forEach(l=>{const n=l.months||1,rr=(l.rate||0)/100/12,P=l.principal||0;
    if(!(l.startY>0&&l.startM>0))return;const k=(y-l.startY)*12+(m-l.startM)+1;if(k<1||k>n||rr===0)return;
    let bal;
    if(l.method==='genkin'){bal=P-Math.round(P/n)*(k-1);}
    else if(l.manualPay>0){bal=Math.max(0,P-l.manualPay*(k-1));}
    else{const pay=Math.round(P*rr*Math.pow(1+rr,n)/(Math.pow(1+rr,n)-1));bal=Math.max(0,Math.round(P*Math.pow(1+rr,k-1)-pay*(Math.pow(1+rr,k-1)-1)/rr));}
    t+=Math.round(bal*rr);});
  return t;
}

// Extract last 6 digits from SKU for sorting
function skuTailNum(sku){
  if(!sku)return -1;
  let s=sku.replace(/-[1-9]$/,'');
  const digits=s.match(/(\d+)/g);
  if(!digits)return -1;
  const last=digits[digits.length-1];
  return last.length>=6?parseInt(last.slice(-6),10):parseInt(last,10);
}

function renderInvTable(finalInv){

  if(ageMin>0)r=r.filter(i=>i.ageDays>=ageMin);

  // Sort
  const sk=invSort.key;
  if(state._invAsinGroup){
    const g={},solo=[];
    r.forEach(it=>{
      // ASINが有効なら ASIN でまとめ、ASIN無し（空・「-」等）は商品名の完全一致だけでまとめる（名前が違えば別商品）
      const a0=(it.asin||'').trim();
      const asinOk=a0&&!/^[-－—―ー_\.なし無]+$/.test(a0);
      const nm=(it.name||'').trim();
      const a=asinOk?('A:'+a0):(nm?('N:'+nm):'');
      if(!a){solo.push(it);return;}
      if(!g[a]){g[a]={...it,_group:true,_skus:[it.sku||'—'],_costsAll:[...(it.costs||[it.cost||0])],_qtySum:(Math.max(it.qty,it.mQty,it.yQty)+(it.rQty||0))};}
      else{const G=g[a];G._skus.push(it.sku||'—');G._costsAll.push(...(it.costs||[it.cost||0]));G._qtySum+=(Math.max(it.qty,it.mQty,it.yQty)+(it.rQty||0));G.platforms=[...new Set([...G.platforms,...it.platforms])];}
    });
    const grouped=Object.values(g).sort((a,b)=>b._qtySum-a._qtySum);
    r=[...grouped,...solo];
  }
  else if(sk!=='default') r.sort((a,b)=>{
    const aHas=!!a.sku, bHas=!!b.sku;
    if(aHas&&!bHas)return -1;if(!aHas&&bHas)return 1;if(!aHas&&!bHas)return 0;
    if(sk==='sku_tail_desc')return skuTailNum(b.sku)-skuTailNum(a.sku);
    if(sk==='sku_tail_asc')return skuTailNum(a.sku)-skuTailNum(b.sku);
    if(sk==='age_asc'){const aa=a.ageDays<0?99999:a.ageDays,bb=b.ageDays<0?99999:b.ageDays;return aa-bb;}
    if(sk==='age_desc'){const aa=a.ageDays<0?-1:a.ageDays,bb=b.ageDays<0?-1:b.ageDays;return bb-aa;}
    if(sk==='price_desc')return b.price-a.price;
    if(sk==='price_asc')return a.price-b.price;
    if(sk==='cost_desc')return (b.cost||0)-(a.cost||0);
    if(sk==='cost_asc')return (a.cost||0)-(b.cost||0);
    if(sk==='pl_desc')return b.platforms.length-a.platforms.length;
    if(sk==='pl_asc')return a.platforms.length-b.platforms.length;
    return 0;
  });

  const tq=r.reduce((s,i)=>s+Math.max(i.qty,i.mQty,i.yQty)+(i.rQty||0),0);
  const tCost=r.reduce((s,i)=>s+(Math.max(i.qty,i.mQty,i.yQty)+(i.rQty||0))*(i.cost||0),0);
  const sum=document.getElementById('inv-summary');if(sum)sum.textContent=`${r.length}件 ・ ${tq}点 ・ 仕入原価合計 ¥${tCost.toLocaleString()}`;
  const mb=document.getElementById('inv-multi-btn');if(mb){mb.style.background=invMulti?'#fff7ea':'#fff';mb.style.borderColor=invMulti?'#d47b06':'var(--line)';mb.style.color=invMulti?'#d47b06':'var(--muted)';mb.textContent=(invMulti?'✓ ':'')+'併売のみ';}
  const sortSel=document.getElementById('inv-sort-key');if(sortSel)sortSel.value=sk;
  let h='';
  r.forEach(it=>{const q=Math.max(it.qty,it.mQty,it.yQty)+(it.rQty||0);
    const av=(it.asin||'').trim();
    const hasA=av&&av!=='—'&&av!=='-'&&av!=='−'&&!/^[\-\u2010-\u2015\u2212\uFF0D]+$/.test(av);
    const asinH=hasA?`<a href="https://www.amazon.co.jp/dp/${esc(av)}" target="_blank" style="color:var(--blue);text-decoration:none;font-weight:600">${esc(av)}</a>`:(av||'—');
    const costs=it.costs||[it.cost||0];
    const costHtml=costs.length<=1?(costs[0]?'¥'+costs[0].toLocaleString():'—'):costs.map(c=>'¥'+c.toLocaleString()).join('<br>');

function downloadInvCSV(){
  const {finalInv}=buildInventory();
  const sq=(document.getElementById('inv-search')?.value||'').toLowerCase();
  const pf=state._invPfVal||'all';
  let r=[...finalInv];
  if(sq)r=r.filter(i=>(i.sku||'').toLowerCase().includes(sq)||(i.name||'').toLowerCase().includes(sq)||(i.maker||'').toLowerCase().includes(sq));
  if(pf==='unlisted')r=r.filter(i=>i.isUnlisted);else if(pf==='pending')r=r.filter(i=>i.isPending);else if(pf!=='all')r=r.filter(i=>i.platforms.includes(pf));
  if(invMulti)r=r.filter(i=>i.platforms.length>1);
  const ageMin=parseInt(document.getElementById('inv-age')?.value||'0',10);
  if(ageMin>0)r=r.filter(i=>i.ageDays>=ageMin);

  const headers=['仕入日','SKU','メーカー','商品名','販売価格','仕入価格','ASIN','仕入先','在庫数','仕入在庫数','在庫期間（日）','販路','金額'];
  const csvQ=v=>{const s=String(v||'');return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;};
  const lines=[headers.join(',')];
  r.forEach(it=>{
    const qty=Math.max(it.qty,it.mQty,it.yQty)+(it.rQty||0);
    const platforms=it.isUnlisted?'未出品':(it.isManualAdd?('手動追加（'+((it._manual||{}).reason||'')+'）'):it.platforms.map(p=>PL[p]||p).join(' / '));
    const ageDays=it.ageDays>=0?it.ageDays:'';
    const costs=it.costs||[it.cost||0];
    const costStr=costs.filter(c=>c).map(c=>'¥'+c.toLocaleString()).join(' / ')||'—';
    lines.push([csvQ(it.purchaseDate||''),csvQ(it.sku),csvQ(it.maker||''),csvQ(it.name),it.price,csvQ(costStr),csvQ(it.asin||''),csvQ(it.supplier||''),qty,it.purchaseQty||'',ageDays,csvQ(platforms),qty*it.price].join(','));
  });

  const bom='\uFEFF';
  const blob=new Blob([bom+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const now=new Date();
  const dateStr=now.getFullYear()+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2);
  a.href=url;a.download=`棚卸在庫_${dateStr}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showAlert(`棚卸在庫を${r.length}件のCSVとしてダウンロードしました`,'ok');
}

// ═══ 手動入力との重複確認（ラクマ・メルカリ・ヤフオク／Yahoo!フリマ）═══
// 金額の一致だけでは重複を確定しない: 同額のCSV行は「重複候補」として表示し（集計には含めたまま）、利用者が商品名・金額・日付を見て
// ✕削除（重複）／↩解除（別取引）で確定する。確定結果は取引キー（オーダーID・決済ID・商品ID）で state.dupDecisions に保持し、再取込でも引き継ぐ。
// 手動入力行の識別（販路ごとの既存仕様）。共通印 _manual に加え、旧データは各販路の形式で判定。判別できない行は「手動ではない」と断定しない（呼び出し側で保持する）
// CSV取込ページの取込状況: CSV由来行だけを月ごとに数え、基準月の行が無ければ「未取込」。手動入力行は件数に含めず別表示
function _csvStatusHtml(key){
  const rows=((typeof _chOrigRows==='function')?_chOrigRows(key):null)||state[key]||[];
  const csv=rows.filter(r=>!_isManualRow(key,r));const mn=rows.length-csv.length;
  const def=(typeof _CH_LIVE_DEF!=='undefined')?_CH_LIVE_DEF.find(d=>d[0]===key):null;const by={};let unk=0;
  csv.forEach(r=>{let ym=null;try{ym=def?_ymOf(def[2](r)):null;}catch(e){}if(!ym){unk++;return;}const k=ym.y*100+ym.m;by[k]=(by[k]||0)+1;});
  const sel=state.selectedYear*100+state.selectedMonth;
  const parts=['<b>'+state.selectedMonth+'月分 '+(by[sel]?by[sel]+'件':'<span style="color:var(--warn)">未取込</span>')+'</b>'];
  Object.keys(by).map(Number).filter(k=>k!==sel).sort().forEach(k=>parts.push(Math.floor(k/100)+'年'+(k%100)+'月分 '+by[k]+'件'));
  if(unk)parts.push('日付不明 '+unk+'件');
  if(mn)parts.push('手動入力 '+mn+'件（CSVではありません）');
  const lastT=state.lastUpload[key];
  const head=csv.length?(lastT?new Date(lastT).toLocaleString('ja-JP')+' 取込':'取込済み'):'CSV未取込';
  return '<div style="font-size:11px;color:var(--muted);margin-top:3px">'+head+' ・ '+parts.join('・')+'</div>';
}

function _isManualRow(key,r){
  if(!r)return false;if(r._manual)return true;
  const t=v=>String(v||'').trim();
  if(key==='sales_priceter')return t(r['AmazonOrderId']).startsWith('manual_')||!!r._manualRet;
  if(key==='sales_mercari')return t(r['注文番号']).startsWith('manual_');
  if(key==='sales_yafuoku')return t(r['決済ID']).startsWith('manual_');
  if(key==='sales_yahoo')return !t(r['OrderId'])&&!!t(r['ItemId'])&&Object.keys(r).filter(k=>k.charAt(0)!=='_').length<=8; // 旧手動行: 注文IDなし＋手動追加の項目だけ
  if(key==='sales_rakuma')return !t(r['_rkOrder'])&&r['_rkOrder']===undefined&&!!t(r['販売日'])&&Object.keys(r).filter(k=>k.charAt(0)!=='_').length<=9; // 旧手動行（_manual なし・オーダーIDの項目自体が無い）
  if(key==='sales_mercari_direct')return r['_mdId']===undefined&&!!t(r['販売日'])&&Object.keys(r).filter(k=>k.charAt(0)!=='_').length<=9;
  if(String(key).indexOf('cu_')===0)return true;
  return false;

// ヤフオクストア高単価手数料: 達成時は5万まで通常料率・超過分は軽減料率
function calcAucStoreFee(sales,hpActive){
  const comm=state.auction_fees.commission/100, pr=state.auction_fees.pr_ad/100;
  const th=parseInt(state.auction_fees.high_price_threshold,10)||0, hp=(parseFloat(state.auction_fees.high_price_rate)||0)/100;

  return Math.round(sales*(comm+pr));
}
// 達成目標判定: 対象額以上の商品の販売価格合計 >= 達成目標（目標0なら常に適用）
function calcAucHpActive(rowsArr){
  const th=parseInt(state.auction_fees.high_price_threshold,10)||0;
  const target=state.auction_fees.high_price_target||0;
  if(!(th>0)||!((parseFloat(state.auction_fees.high_price_rate)||0)>0))return false;
  if(target<=0)return true;
  let sum=0;
  rowsArr.forEach(r2=>{
    if(r2._isRefund)return;
    const gp=(r2['GetPointFixDate']||'').trim();if(gp)return;
    const s=(parseInt((r2['UnitPrice']||'0').replace(/[,]/g,''),10)||0)*(parseInt(r2['Quantity']||'0',10)||0);
    if(s>=th)sum+=s;
  });
  return sum>=target;
}

// 比例配賦（端数は最大剰余法で合計を一致させる）
function _allocProportional(total,weights){
  total=Math.round(total||0);const n=(weights||[]).length;if(!n)return [];if(!total)return weights.map(()=>0);
  const sum=weights.reduce((s,w)=>s+Math.max(0,w||0),0);

  const fl=shares.map(x=>Math.floor(x));let rem=total-fl.reduce((s,x)=>s+x,0);
  const order=shares.map((x,i)=>({i,f:x-Math.floor(x)})).sort((a,b)=>(b.f-a.f)||(a.i-b.i));
  for(let k=0;k<order.length&&rem>0;k++){fl[order[k].i]+=1;rem--;}
  return fl;
}
function _moNormalizeRows(rows){

    const fromOrder=rec=>{['purchase_date','payment_date','buyer_name','order_type','pre_order_release_date','currency'].forEach(k=>{if(o[k]!==undefined&&o[k]!=='')rec[k]=o[k];});rec.order_price=String(n(o['order_price']));rec.order_coupon_discount_amount=String(Math.abs(n(o['order_coupon_discount_amount'])));rec._orderShip=n(o['shipping_price']);};
    if(!ls.length){const rec={order_id:oid};fromOrder(rec);rec.coupon_discount_amount=rec.order_coupon_discount_amount;rec._lineKey='';rec._lineN=0;rec._noProduct=1;rec._fmt='v2';out.push(rec);return;}
    // 商品行の識別キー: 配送ID（shipping_id）＋商品識別（SKU → variant_id → 商品名）。CSVの並び順には依存しない。
    // 同じ組み合わせの行が複数ある（同一配送・同一SKUが2行など）場合は番号を付けて保持するが、行を特定できないため手修正は自動適用しない（_keyAmbig）
    const keys=ls.map((p,i)=>{const sid=t(p['shipping_id']);const sku=t(p['original_product_id']),v=t(p['variant_id']),nm=t(p['product_name']);const ident=sku?('K:'+sku):(v?('V:'+v):(nm?('N:'+nm):''));if(sid||ident)return 'S:'+sid+'|'+ident;return 'I:'+i;});

function _meCxPriorResolved(oid,c,pRows,cRows){

function toggleMonthlyTask(id,checked,_force){
  const ymk=state.selectedYear+'-'+state.selectedMonth;
  if(!state.monthlyTasks)state.monthlyTasks={};
  if(!state.monthlyTasks[ymk])state.monthlyTasks[ymk]={};
  if(checked)state.monthlyTasks[ymk][id]=1;else delete state.monthlyTasks[ymk][id];
  try{delete state.monthlyTasks[ymk][id+'_a'];}catch(e){}
  if(id==='m1'&&checked&&!_force){
    try{const miss=_m1MissingReports();const chm=_m1MissingChannels();if(miss.length>0||chm.length>0){delete state.monthlyTasks[ymk][id];_m1ConfirmDialog(miss,chm);save();renderAll();return;}}catch(e){}
  }
  if(checked&&(id==='w_zc'||id==='w_zs')){
    try{const o=state.monthlyTasks[ymk];if(o.w_zc&&o.w_zs)o.m8=1;}catch(e){}
  }else if(checked&&id.indexOf('w_fc_')===0){
    try{
      if(['sales','purchase','inv'].every(x=>state.monthlyTasks[ymk]['w_fc_'+x]))state.monthlyTasks[ymk].m11=1;
    }catch(e){}
  }else if(checked&&id.indexOf('w_mm_')===0){
    try{
      const chs=[];if(_chOn('sales_mercari'))chs.push('mercari');if(_chOn('sales_yafuoku'))chs.push('yafuoku');if(_chOn('sales_mercari_direct'))chs.push('mercari_direct');if(_chOn('sales_rakuma'))chs.push('rakuma');_cuList().forEach(c=>{if(_chOn('cu_'+c.id))chs.push('cu_'+c.id);});
      if(chs.length>0&&chs.every(x=>state.monthlyTasks[ymk]['w_mm_'+x]))state.monthlyTasks[ymk].m10=1;
    }catch(e){}
  }else if(checked&&id.indexOf('w_pd_')===0){
    try{
      const chs=[];if(_chOn('sales_yafuoku'))chs.push('yafuoku');if(_chOn('sales_rakuma'))chs.push('rakuma');
      if(chs.length>0&&chs.every(x=>state.monthlyTasks[ymk]['w_pd_'+x]))state.monthlyTasks[ymk].m4=1;
    }catch(e){}
  }else if(id.indexOf('w_iv_')===0){
    try{
      const ivs=_collectInvChecks();
      if(checked&&!_force){const it=ivs.find(x=>'w_'+x.id===id);if(it&&it.mode==='confirm'&&it.cnt>0){delete state.monthlyTasks[ymk][id];_ivConfirmDialog(id,it);save();renderAll();return;}}
      const o=state.monthlyTasks[ymk];
      if(ivs.every(x=>o['w_'+x.id])){if(!o.m13){o.m13=1;o.m13_a=1;}}else if(o.m13_a){delete o.m13;delete o.m13_a;}
    }catch(e){}
  }else if(checked&&id.indexOf('w_')===0){
    try{const ws=_collectWarns();if(ws.length>0&&ws.every(x=>_warnDone(x.id)))state.monthlyTasks[ymk].m3=1;}catch(e){}
  }
  save();renderAll();
}

function _ymNext(ym){const p=String(ym||'').split('-');let y=parseInt(p[0],10),m=parseInt(p[1],10);if(!y||!m)return '';m++;if(m>12){m=1;y++;}return y+'-'+String(m).padStart(2,'0');}
function _ymPrev(ym){const p=String(ym||'').split('-');let y=parseInt(p[0],10),m=parseInt(p[1],10);if(!y||!m)return '';m--;if(m<1){m=12;y--;}return y+'-'+String(m).padStart(2,'0');}

// 今回作業する月（prepYM）の準備状況: 削除対象＝その前月。削除記録はその月替わりに対応するもの（削除時の基準月＝前月 かつ 対応する作業月＝今回の月 かつ 日時が前月の保存以降）だけを使う
function _prepStatus(ym){
  const prevYm=_ymPrev(ym);const pp=prevYm.split('-');const pe=(state.monthlyData||[]).find(d=>d.year===parseInt(pp[0],10)&&d.month===parseInt(pp[1],10))||null;
  const lr=state.lastReset||null;const ts=v=>{const t=Date.parse(String(v||''));return isNaN(t)?null:t;};
  let resetDone=false;if(lr&&lr.ym===prevYm&&(lr.prep||_ymNext(lr.ym))===ym){const a=ts(lr.at),s=pe?ts(pe.savedAt):null;resetDone=(a!==null)&&(s===null||a>=s);}
  const workEmpty=_RESET_KEYS.every(([k,,init])=>JSON.stringify(state[k]===undefined?null:state[k])===JSON.stringify(init));
  const selYm=state.selectedYear+'-'+String(state.selectedMonth).padStart(2,'0');
  return {ym,prevYm,pe,lr,resetDone,workEmpty,onTarget:selYm===ym,onPrev:selYm===prevYm,selYm};
}

function _stepIdOfTask(tid){

function _idbOpen(){return new Promise((res,rej)=>{const q=indexedDB.open('invmgr_fs',1);q.onupgradeneeded=()=>{q.result.createObjectStore('kv');};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}

async function _idbAll(prefix){const db=await _idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('kv','readonly');const st=tx.objectStore('kv');const out={};const q=st.openCursor();q.onsuccess=()=>{const cur=q.result;if(cur){if(String(cur.key).indexOf(prefix)===0)out[String(cur.key).slice(prefix.length)]=cur.value;cur.continue();}else res(out);};q.onerror=()=>rej(q.error);});}
async function _idbGet(k){const db=await _idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('kv','readonly');const rq=tx.objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function _idbDel(k){const db=await _idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

function _mdStable(v){const rep=(k,x)=>{if(x&&typeof x==='object'&&!Array.isArray(x)){const o={};Object.keys(x).sort().forEach(kk=>{if(kk!=='_at')o[kk]=x[kk];});return o;}return x;};try{return JSON.stringify(v,rep)||'null';}catch(e){return String(Math.random());}}
function _mdHash(s){let h1=0x811c9dc5,h2=0x1b873593;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=(Math.imul(h2,31)+c)>>>0;}return h1.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0');}
// 指紋はキャッシュせず毎回計算する（同じオブジェクトを編集した後に古い比較結果を返さないため）
function _mdDetailSig(d){
  if(!d||typeof d!=='object')return '';
  const s=d.salesItems||[],p=d.purchaseItems||[],inv=d.inventoryItems||[];const sum=(arr,k)=>arr.reduce((a,i)=>a+(Number(i&&i[k])||0),0);
  return [s.length,sum(s,'sales'),sum(s,'cost'),sum(s,'profit'),sum(s,'fee'),sum(s,'refund'),(d.prevSalesItems||[]).length,p.length,sum(p,'cost'),inv.length,sum(inv,'qty'),_mdHash(_mdStable(d))].join('|');

// localStorage の複製は文字列が同じなら前回の解析結果を使う（毎回の解析・ハッシュ計算を避ける）
const _mdLocalParsed={};
function _mdLocalGet(key){

  if(raw===null||raw===undefined){delete _mdLocalParsed[key];return null;}
  const c=_mdLocalParsed[key];if(c&&c.raw===raw)return c.obj;

// 複製の一覧（src: local / idb / mem / cloud）
function _mdCandidates(key,withCloud){
  const c=[];
  try{const v=_mdLocalGet(key);if(v)c.push({src:'local',d:v});}catch(e){}
  try{if(window._idbCache&&window._idbCache[key]&&typeof window._idbCache[key]==='object')c.push({src:'idb',d:window._idbCache[key]});}catch(e){}
  try{if(window._mdUnsaved&&window._mdUnsaved[key])c.push({src:'mem',d:window._mdUnsaved[key]});}catch(e){}
  if(withCloud){try{if(window._mdCache&&window._mdCache[key]&&typeof window._mdCache[key]==='object')c.push({src:'cloud',d:window._mdCache[key]});}catch(e){}}

}
// 複製から採用する1つを決める。戻り値 {pick, src, at, conflict: [{src,at,sig,data}] | null}
function _mdChoose(c){
  if(!c||!c.length)return null;
  c=c.filter((x,i)=>x&&x.d&&c.findIndex(y=>y&&y.d===x.d)===i); // 同じオブジェクトを指す候補は1つに（保存直後のキャッシュなど。内容は同一）
  if(!c.length)return null;
  const one=x=>({pick:x.d,src:x.src,at:x.d._at||null,conflict:null});
  if(c.length===1)return one(c[0]);
  const withAt=c.filter(x=>x.d&&x.d._at);
  let top;
  if(withAt.length){const max=withAt.reduce((m,x)=>String(x.d._at)>m?String(x.d._at):m,'');top=withAt.filter(x=>String(x.d._at)===max);}
  else top=c;

  return {pick:top[0].d,src:top[0].src,at:top[0].d._at||null,conflict:top.map(x=>({src:x.src,at:x.d._at||null,sig:_mdDetailSig(x.d),data:x.d}))};

// 競合の記録: 既に記録済みの複製（移行時・クラウド受信時など、今の候補一覧に無いものも含む）は消さず、内容（sig）が新しいものだけ追加する
function _mdConflictAdd(key,list){
  window._mdConflicts=window._mdConflicts||{};
  const cur=window._mdConflicts[key]||[];
  (list||[]).forEach(x=>{if(!x||!x.data)return;if(cur.some(y=>y.sig===x.sig))return;cur.push({src:x.src,at:x.at||null,sig:x.sig,data:x.data});});
  if(cur.length)window._mdConflicts[key]=cur;

}
// 明示的に解決する（利用者の操作でのみ呼ぶ。通常の読込・保存では記録を消さない）
function _mdConflictResolve(key){window._mdConflicts=window._mdConflicts||{};delete window._mdConflicts[key];if(window._mdConflictsBk&&window._mdConflictsBk[key]){delete window._mdConflictsBk[key];try{SS('inv_mdconflicts',window._mdConflictsBk);}catch(e){}}}
function _mdDetailPick(key){
  const r=_mdChoose(_mdCandidates(key,true));
  if(!r)return null;
  if(r.conflict)_mdConflictAdd(key,r.conflict); // 競合が無くても、過去に記録した競合データはここでは消さない

// 保存の直列化（同じキーへの IndexedDB 操作を順番に実行）と連番（後から始まった保存が最新）
const _mdSeq={},_mdQ={},_mdLastAt={};
function _mdChain(key,fn){const p=(_mdQ[key]||Promise.resolve()).then(fn,fn);_mdQ[key]=p.catch(()=>{});return p;}
// 明細を保存（async）。戻り値 {ok, where:'local'|'idb'|null, error}
// localStorage に書けたら読み返して確認し、その後で古い IndexedDB 複製を消す。書けなければ IndexedDB に書いて読み返し確認し、その後で古い localStorage 複製を消す。
// 確認が取れるまで既存の複製は消さない。後から別の保存が始まっていたら（連番が進んでいたら）古い方の削除処理は何もしない。
async function _mdDetailSave(key,det){
  if(!det||typeof det!=='object')return {ok:false,where:null,error:'invalid'};
  if(!det._at){let at=new Date().toISOString();if(_mdLastAt[key]&&at<=_mdLastAt[key])at=new Date(new Date(_mdLastAt[key]).getTime()+1).toISOString();det._at=at;} // 自動付与の保存時刻は同じキーで単調増加にする
  _mdLastAt[key]=det._at;
  const seq=(_mdSeq[key]=(_mdSeq[key]||0)+1);
  window._mdCache=window._mdCache||{};window._idbCache=window._idbCache||{};window._mdUnsaved=window._mdUnsaved||{};
  const want=_mdDetailSig(det);
  let ok=false;
  try{localStorage.setItem(_LSP+key,JSON.stringify(det));const back=_mdLocalGet(key);ok=!!(back&&back._at===det._at&&_mdDetailSig(back)===want);}catch(e){ok=false;}
  if(ok){
    window._mdCache[key]=det;delete window._idbCache[key];delete window._mdUnsaved[key];
    await _mdChain(key,async()=>{if(_mdSeq[key]!==seq)return;try{const cur=await _idbGet(_mdIdbKey(key));if(cur!==undefined&&cur!==null&&_mdSeq[key]===seq)await _idbDel(_mdIdbKey(key));}catch(e){}});

  }
  // localStorage に書けない: IndexedDB へ退避。書込→読み返しの確認が取れてから旧 localStorage 複製を消す
  const r=await _mdChain(key,async()=>{
    try{
      await _idbSet(_mdIdbKey(key),det);
      const v=await _idbGet(_mdIdbKey(key));
      if(!(v&&v._at===det._at&&_mdDetailSig(v)===want))return {ok:false,where:null,error:'verify'};
      if(_mdSeq[key]===seq){
        window._idbCache[key]=det;window._mdCache[key]=det;delete window._mdUnsaved[key];

    }catch(e){return {ok:false,where:null,error:String((e&&e.message)||e)};}

  }

}
