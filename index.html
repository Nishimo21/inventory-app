// 取込済みファイルの移動: ①まず「販路名_元ファイル名」にリネーム（同名があれば _2,_3…）②取込済みフォルダへ移動。結果と失敗理由を結果行に返す
async function _bulkMoveFile(handle,origName,pfx,doneDir){
  if(!handle||!handle.move)return ' ⚠ 移動できません（このブラウザはファイル移動に未対応）';
  const base=origName.indexOf(pfx)===0?origName:pfx+origName;
  const exists=async(dir,n)=>{if(!dir)return false;try{await dir.getFileHandle(n);return true;}catch(e){return false;}};
  let target=base;
  for(let i=2;i<=20&&(await exists(doneDir,target));i++)target=base.replace(/(\.csv)$/i,'_'+i+'$1');
  const errs=[];
  // ① リネーム（移動前に実施。同名で失敗したら連番を試す）
  if(handle.name!==target){
    let ok=false;
    for(let i=0;i<20&&!ok;i++){
      const n=i===0?target:base.replace(/(\.csv)$/i,'_'+(i+1)+'$1');
      if(i>0&&(await exists(doneDir,n)))continue;
      try{await handle.move(n);target=n;ok=true;}catch(e){if(i===0)errs.push('リネーム失敗: '+(e&&e.message||e));}
    }
  }
  // ② 取込済みフォルダへ移動
  if(doneDir){
    try{await handle.move(doneDir);}
    catch(e){
      try{await handle.move(doneDir,target);}
      catch(e2){errs.push('移動失敗: '+(e2&&e2.message||e2));return ' ⚠ '+errs.join(' / ')+'（ファイルは元の場所のまま: '+handle.name+'）';}
    }
  }
  // ③ それでも名前が変わっていなければ、取込済み内で「コピー＋元を削除」でリネーム（move(name) が使えない環境向け）
  if(doneDir&&handle.name&&handle.name!==target){
    try{
      const src=await handle.getFile();
      const nf=await doneDir.getFileHandle(target,{create:true});
      const ws=await nf.createWritable();await ws.write(src);await ws.close();
      try{await doneDir.removeEntry(handle.name);}catch(e){errs.push('元ファイル削除失敗: '+(e&&e.message||e));}
      return ' → 取込済みフォルダへ移動（'+target+'）'+(errs.length?' ※'+errs.join(' / '):'');
    }catch(e){errs.push('コピーによるリネーム失敗: '+(e&&e.message||e));}
  }
  const nm=handle.name||target;
  return ' → '+(doneDir?'取込済みフォルダへ移動':'リネーム')+'（'+nm+'）'+(nm!==target?' ※リネームできず: '+errs.join(' / '):'');
}

function isReimbursedSku(sku){

function _reimbMonth(y,m){

function _reimbRecalcLinks(){

async function handleReimbCSV(input){
  const file=input.files?.[0];if(!file)return;
  let text;
  try{const buf=await file.arrayBuffer();text=new TextDecoder('utf-8').decode(buf);const g=(text.match(/\ufffd/g)||[]).length;if(g>5)text=new TextDecoder('shift_jis').decode(buf);}catch{text=await file.text();}
  const data=parseCSV(text);
  if(!data.length){showBanner('CSVにデータがありません','err');return;}
  const pick=(row,keys)=>{for(const k of keys){if(row[k]!==undefined&&String(row[k]).trim()!=='')return String(row[k]).trim();}return '';};
  // 仕入金額の紐づけマップ（products + 仕入ログ）
  const costExact={},costTail={};
  const addCost=(s,co)=>{if(!s||!co)return;const b=_reimbNorm(s);if(costExact[b]===undefined)costExact[b]=co;const t=_reimbTail(b);if(costTail[t]===undefined)costTail[t]=co;};

  const lookupCost=s=>{const b=_reimbNorm(s);if(costExact[b]!==undefined)return costExact[b];const t=_reimbTail(b);return costTail[t]!==undefined?costTail[t]:0;};
  const existingIds=new Set((state.reimbursements||[]).map(rr=>String(rr.id)));

  data.forEach(row=>{

    const sku=pick(row,['sku','SKU','出品者SKU']);
    if(!id||!sku)return;
    if(existingIds.has(id)){dup++;return;}

    const amount=Math.round(parseFloat(pick(row,['合計返金額','amount-total','商品あたりの返金額']).replace(/,/g,''))||0);

      reason:pick(row,['理由','reason']),

  const beforeS=state.sales_priceter.length;

}

async function exportBackup(){
  // 保存先（IndexedDB 退避）の読込完了を待ってから作る。待たずに作ると退避済みの最新明細が抜ける
  try{window._idbReadyDone=await Promise.race([window._idbReady,new Promise(r=>setTimeout(()=>r(false),8000))]);}catch(e){window._idbReadyDone=false;}
  if(window._idbReadyDone!==true){try{showBanner('⚠ 拡張保存領域（IndexedDB）の読込が完了していないため、バックアップに退避済みの明細が含まれない可能性があります。ページを再読込してからやり直してください','warn');}catch(e){}}
  const _bk=_backupObject();
  const json=JSON.stringify(_bk);
  const d=new Date();
  const fn='在庫マネージャー_バックアップ_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.json';
  // メインフォルダ登録済みなら「バックアップデータ保存ファイル」へ直接保存
  try{
    // 専用登録があれば最優先、なければメインフォルダのサブフォルダへ
    let hb=null;try{hb=await _idbGet('bkDir');}catch(e){}
    if(hb&&hb.getFileHandle){
      let p=await hb.queryPermission({mode:'readwrite'});
      if(p!=='granted')p=await hb.requestPermission({mode:'readwrite'});
      if(p==='granted'){
        const fh=await hb.getFileHandle(fn,{create:true});
        const w0=await fh.createWritable();await w0.write(json);await w0.close();
        showBanner('バックアップを保存しました（'+hb.name+'/'+fn+'）','ok');return true;
      }
    }
    const h=await _idbGet('bulkDir');
    if(h&&h.getDirectoryHandle){
      let p=await h.queryPermission({mode:'readwrite'});
      if(p!=='granted')p=await h.requestPermission({mode:'readwrite'});
      if(p==='granted'){
        const dir=await h.getDirectoryHandle('バックアップデータ保存ファイル',{create:true});
        const fh=await dir.getFileHandle(fn,{create:true});
        const w2=await fh.createWritable();
        await w2.write(json);await w2.close();
        showBanner('バックアップを保存しました（バックアップデータ保存ファイル/'+fn+'）','ok');
        return true;
      }
    }
  }catch(e){console.warn('フォルダ保存失敗→DLに切替:',e);}
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=fn;
  a.click();
  showBanner('バックアップをダウンロードしました','ok');return true;
}
window.exportBackup=exportBackup;

// メルカリ注文データCSV (merge multiple)
async function handleMercariOrderUpload(input){
  const file=input.files?.[0];if(!file)return;
  let text;
  try{const buf=await file.arrayBuffer();text=new TextDecoder('utf-8').decode(buf);const g=(text.match(/\ufffd/g)||[]).length;if(g>5||(/[\x80-\xff]{4,}/.test(text)&&!/[\u3000-\u9fff]/.test(text)))text=new TextDecoder('shift_jis').decode(buf);}catch{text=await file.text();}
  const _nz=_moNormalizeRows(parseCSV(text));const data=_slimRows(_nz.rows);
  const _t=v=>String(v||'').trim();
  if(!data.length){ // ヘッダだけ（0件）: 既に取り込んだ注文データは消さない
    try{showBanner('メルカリShops 注文データ: 0件（ヘッダのみ）のため追加はありません。取込済みの注文データ '+(state.mercari_orders||[]).length+'件は保持しています','ok');}catch(e){}
    if(input&&'value' in input)try{input.value='';}catch(e){}
    return;
  }
  // 既存と統合: 同じ注文番号は今回の内容で置き換え（まとめ買いの複数商品行はすべて保持。注文番号＋商品行キーで重複排除）
  const existing=state.mercari_orders||[];
  const incoming=new Set(data.map(r=>_t(r['order_id'])).filter(Boolean));
  const map={};const put=r=>{const id=_t(r['order_id']);if(!id)return;map[_moOvKey(r)]=r;};
  existing.forEach(r=>{if(!incoming.has(_t(r['order_id'])))put(r);});
  data.forEach(put);
  state.mercari_orders=Object.values(map);
  state.moCsvFmt=_nz.fmt;
  state.lastUpload={...state.lastUpload,mercari_orders:new Date().toISOString()};
  save();renderAll();
}
window.handleMercariOrderUpload=handleMercariOrderUpload;

  if(rDet&&rMon){window._noCloud=false;try{save();}catch(err){}renderAll();showBanner('保存棚卸の更新を保存できなかったため、変更前に戻しました（'+msg+'／'+why+'）。戻した明細・合計を読み返して一致を確認済みです。ブラウザの保存領域を確認してください','err');return false;}
  renderAll();showBanner('⚠ 復旧未確認: 保存棚卸の更新（'+msg+'）で'+why+'。変更前へ戻す保存も確認できません（未確認: '+[rDet?'':'棚卸明細',rMon?'':'月次合計'].filter(Boolean).join('・')+'）。画面上は元に見えても再読込で変わる可能性があります。この画面では操作せず、⚙設定 →「📂 復元」で直近のバックアップファイル（在庫マネージャー_バックアップ_日時.json）から復元してください。クラウドへの送信は止めています','err');return false;

function calcRange(){
  const sy=parseInt(document.getElementById('range-sy')?.value)||2026;
  const sm=parseInt(document.getElementById('range-sm')?.value)||1;
  const ey=parseInt(document.getElementById('range-ey')?.value)||2026;
  const em=parseInt(document.getElementById('range-em')?.value)||12;
  const inRange=state.monthlyData.filter(d=>{
    const v=d.year*100+d.month;return v>=sy*100+sm&&v<=ey*100+em;
  });
  if(!inRange.length){state._rangeResult=null;showBanner('指定期間にデータがありません','err');renderAll();return;}
  const r={sales:0,refund:0,fees:0,cost:0,profit:0,qty:0,invCost:0,purchases:0,months:inRange.length};
  const platAgg={};
  inRange.forEach(d=>{r.sales+=d.sales||0;r.refund+=d.refund||0;r.fees+=d.fees||0;r.cost+=d.cost||0;r.profit+=d.profit||0;r.qty+=d.qty||0;r.purchases+=d.purchases||0;r.purchaseCount=(r.purchaseCount||0)+_pcEff(d);r.retPL=(r.retPL||0)+(d.retPL||0);r.retCount=(r.retCount||0)+(d.retCount||0);
    if(d.platforms){Object.entries(d.platforms).forEach(([n,pd])=>{if(!platAgg[n])platAgg[n]={sales:0,fees:0,profit:0,qty:0};platAgg[n].sales+=pd.sales||0;platAgg[n].fees+=pd.fees||0;platAgg[n].profit+=pd.profit||0;platAgg[n].qty+=pd.qty||0;});}
  });
  const latestInRange=[...inRange].sort((a,b)=>b.year!==a.year?b.year-a.year:b.month-a.month)[0];
  r.invCost=latestInRange.invCost||0;r.invCount=latestInRange.invCount||0;
  // 月別棚卸推移（増減表示用）
  const sortedRange=[...inRange].sort((a,b)=>a.year!==b.year?a.year-b.year:a.month-b.month);
  r._invMonthly=sortedRange.map(d=>{
    const det=LS('inv_md_'+d.id);
    const invPrice=(det&&det.inventoryItems)?det.inventoryItems.reduce((s,i)=>s+(i.qty||0)*(i.price||0),0):null;
    return{y:d.year,m:d.month,invCount:d.invCount||0,invCost:d.invCost||0,invPrice,cost:d.cost||0};
  });
  const _first=r._invMonthly[0]||{},_last=r._invMonthly[r._invMonthly.length-1]||{};
  // 期首 = 集計開始月の「前月」の保存データ（あれば）。なければ初月末を基準にする
  // 期首の基準は「選択した開始月」ではなく「範囲内の最初のデータ月」より前とする
  const _dataStartVal=(_first&&_first.y)?(_first.y*100+_first.m):(sy*100+sm);
  const _prevEntries=state.monthlyData.filter(d=>(d.year*100+d.month)<_dataStartVal).sort((a,b)=>(b.year*100+b.month)-(a.year*100+a.month));
  let _base=_prevEntries[0]||null;
  // 期首棚卸（手動登録）も候補: 保存月より新しい（データ開始月に近い）なら優先
  if(state.openingInv&&(state.openingInv.year*100+state.openingInv.month)<_dataStartVal){
    if(!_base||(state.openingInv.year*100+state.openingInv.month)>(_base.year*100+_base.month)){
      _base={year:state.openingInv.year,month:state.openingInv.month,invCost:state.openingInv.invCost||0,invCount:state.openingInv.invCount||0,_isOpening:true};
    }
  }
  let _basePrice=null;
  if(_base&&_base.id){const bd=LS('inv_md_'+_base.id);if(bd&&bd.inventoryItems)_basePrice=bd.inventoryItems.reduce((s,i)=>s+(i.qty||0)*(i.price||0),0);}
  r.invBaseLabel=_base?(_base.year+'/'+String(_base.month).padStart(2,'0')+'末（期首）'):((_first.y||'')+'/'+String(_first.m||'').padStart(2,'0')+'末（初月末基準）');
  r.invBaseIsTrue=!!_base;
  r._invBase=_base?{y:_base.year,m:_base.month,invCount:_base.invCount||0,invCost:_base.invCost||0,invPrice:_basePrice}:null;
  // 棚卸数は入力がある（>0）最初の月を集計開始とする（期首→各月の順）
  r.invQtyEnd=_last.invCount||0;
  {
    let _qs=null;
    if(_base&&(_base.invCount||0)>0)_qs={y:_base.year,m:_base.month,cnt:_base.invCount,base:true};
    if(!_qs){for(const mo of r._invMonthly){if((mo.invCount||0)>0){_qs={y:mo.y,m:mo.m,cnt:mo.invCount};break;}}}
    r.invQtyStart=_qs?_qs.cnt:0;
    r.invQtyStartLabel=_qs?(_qs.y+'/'+String(_qs.m).padStart(2,'0')+'末'+(_qs.base?'（期首）':'')):null;
    r.invQtyDiff=r.invQtyEnd-r.invQtyStart;
  }
  r.invCostStart=_base?(_base.invCost||0):(_first.invCost||0);r.invCostEnd=_last.invCost||0;r.invCostDiff=r.invCostEnd-r.invCostStart;
  // 棚卸売価は明細データがある最初の月を集計開始とする（期首→各月の順）
  r.invPriceEnd=(_last.invPrice!=null)?_last.invPrice:null;
  {
    let _ps=null;
    if(_base&&_basePrice!=null&&_basePrice>0)_ps={y:_base.year,m:_base.month,price:_basePrice,base:true};
    if(!_ps){for(const mo of r._invMonthly){if(mo.invPrice!=null&&mo.invPrice>0){_ps={y:mo.y,m:mo.m,price:mo.invPrice};break;}}}
    r.invPriceStart=_ps?_ps.price:null;
    r.invPriceStartLabel=_ps?(_ps.y+'/'+String(_ps.m).padStart(2,'0')+'末'+(_ps.base?'（期首）':'')):null;
    r.invPriceDiff=(r.invPriceStart!=null&&r.invPriceEnd!=null)?r.invPriceEnd-r.invPriceStart:null;
  }
  // 在庫回転率の平均（各月の 売上原価÷棚卸原価 の平均）
  const _turns=sortedRange.filter(d=>(d.invCost||0)>0).map(d=>(d.cost||0)/(d.invCost)*100);
  r.avgTurnover=_turns.length>0?(_turns.reduce((s,v)=>s+v,0)/_turns.length):0;
  r.deposit=r.sales-r.fees+(r.retPL||0);r.cf=r.deposit-r.purchases;
  r.label=`${sy}/${String(sm).padStart(2,'0')} 〜 ${ey}/${String(em).padStart(2,'0')}`;
  r.platforms=platAgg;
  // Merge detail data from all months
  let allSalesItems=[],allPurchItems2=[],allSuppliers={};
  inRange.forEach(d=>{
    const det=LS('inv_md_'+d.id);
    if(det){
      if(det.salesItems)allSalesItems.push(..._mdMainItems(det,d));
      if(det.purchaseItems)allPurchItems2.push(...det.purchaseItems);
      if(det.supplierSummary)det.supplierSummary.forEach(s=>{if(!allSuppliers[s.name])allSuppliers[s.name]={count:0,total:0};allSuppliers[s.name].count+=s.count;allSuppliers[s.name].total+=s.total;});
    }
  });
  const latestDet=LS('inv_md_'+latestInRange.id);
  r._salesItems=allSalesItems;r._purchaseItems=allPurchItems2;
  r._inventoryItems=latestDet?.inventoryItems||[];
  r._supplierSummary=Object.entries(allSuppliers).sort((a,b)=>b[1].total-a[1].total).map(([n,d])=>({name:n,count:d.count,total:d.total}));
  r._months=sortedRange.map(d=>d.id);
  state._rangeResult=r;state._rangeView='summary';
  renderAll();
}
window.calcRange=calcRange;

function startEdit(el,field,idx,dk){
  if(el.querySelector('input'))return;
  const raw=el.textContent.replace(/[¥,個\u2014\u2015\u2012\u2013—\s]/g,'').trim();
  const val=parseInt(raw)||0;
  el.innerHTML='<input type="number" value="'+Math.abs(val)+'" style="width:80px;font-size:12px;padding:3px 5px;border:2px solid var(--blue);border-radius:4px">';
  const inp=el.querySelector('input');
  inp.focus();inp.select();
  inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();doSave();}};
  inp.onblur=function(){setTimeout(doSave,80);};
  let saved=false;
  function doSave(){
    if(saved)return;saved=true;
    const nv=parseInt(inp.value)||0;
    let items;
    if(dk==='priceter')items=state.sales_priceter;
    else if(dk==='mercari')items=state.sales_mercari;
    else if(dk==='yafuoku'||dk==='yahoo_free')items=state.sales_yafuoku;
    else if(dk==='mercari_direct')items=state.sales_mercari_direct;
    else if(dk==='rakuma')items=state.sales_rakuma;
    else if(String(dk||'').indexOf('cu_')===0)items=_cuRows(dk.slice(3));
    else{
      items=state.sales_yahoo;
    }
    if(dk==='mercari'&&items&&idx>=items.length){
      // メルカリShops 発送前の仮行: 注文データから毎回生成されるため、手修正は注文番号ごとの上書きとして保存
      const pre=_mePreRows()[idx-items.length];
      if(pre){
        const oid=pre._ovKey||pre['注文番号'];state.mePreOverrides=state.mePreOverrides||{};const ov=state.mePreOverrides[oid]||{};
        const q=parseInt(pre['数量']||'1',10)||1;
        if(field==='sales')ov['売上（税込）']=String(nv);
        else if(field==='fee')ov['販売手数料（税込）']=String(nv);
        else if(field==='qty')ov['数量']=String(nv);
        else if(field==='ship')ov['_ship']=String(nv);
        else if(field==='cost'){ov['_costOverride']=Math.round(nv/q);ov._costFixed=1;delete ov['_profitOverride'];_cfSet('sales_mercari',pre,ov['_costOverride']);}
        else if(field==='profit'){ov['_profitOverride']=nv;_cfSetP('sales_mercari',pre,nv);}
        state.mePreOverrides[oid]=ov;
        try{if(pre._ovHeld||(_moLinesOf(pre['注文番号']).find(l=>_moOvKey(l)===pre._ovKey)||{})._keyAmbig){showBanner('この注文には同じ配送ID・同じ商品の行が複数あり、手修正の対象行を特定できません。保存しましたが自動適用はせず「再確認」として表示します','warn');}else{showBanner('発送前の取引を手修正しました（売上CSVに載るまで保持されます）','ok');}}catch(e){}
      }
      save();renderAll();return;
    }
    if(!items||!items[idx]){renderAll();return;}
    const r=items[idx];r._editAt=new Date().toISOString(); // 保存後の編集を一括削除前の未保存確認で検出するための日時
    if(field==='date'){
      const _dkey={priceter:'注文日',mercari:'販売日',yafuoku:'取扱日',yahoo_free:'取扱日',mercari_direct:'販売日',rakuma:'販売日'}[dk]||'LeadTimeStart';
      r[_dkey]=nv;
      save();renderAll();return;
    }
    if(dk==='priceter'){
      const q=parseInt(r['売れた個数']||'1',10)||1;
      // 売上・手数料・仕入・数量を手で直した行は、CSVの「粗利益」ではなく 売上−手数料−仕入 で利益を再計算する（_prRecalc）
      if(field==='sales'||field==='qty'||field==='fee'||field==='cost')r._prRecalc=1;
      if(field==='sales'){const u=Math.round(nv/q);r['出品価格']=String(u);r['単価']=String(u);}
      else if(field==='qty')r['売れた個数']=String(nv);
      else if(field==='fee')r['Amazon手数料']=String(nv);
      else if(field==='ship')r['_ship']=String(nv);
      else if(field==='cost'){const u=Math.round(nv/q);r['仕入れ価格']=String(u);_cfSet('sales_priceter',r,u);}
      else if(field==='profit'){r['_profitOverride']=nv;_cfSetP('sales_priceter',r,nv);}
      else if(field==='refund')r['返金総額']=nv>0?String(-nv):'';
    }else if(dk==='mercari'){
      const q=parseInt(r['数量']||'1',10)||1;
      if(field==='sales')r['売上（税込）']=String(nv);
      else if(field==='qty')r['数量']=String(nv);
      else if(field==='fee')r['販売手数料（税込）']=String(nv);
      else if(field==='ship')r['_ship']=String(nv);

async function testGas(){
  showAlert('Apps Scriptに接続テスト中...','info');
  state.fetchError=null;
  // トークン無しでアクセスして「認証エラー」が返れば正常動作
  const url=state.gasUrl+'?id=test&tab=test';
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),20000);
    const r=await fetch(url,{redirect:'follow',signal:controller.signal});
    clearTimeout(timeout);
    const text=await r.text();
    if(text.includes('認証エラー')){
      // 認証エラー = スクリプトは動いている。次にトークン付きで試す
      const url2=state.gasUrl+'?token='+encodeURIComponent(state.gasToken)+'&id=test&tab=test';
      try{
        const controller2=new AbortController();
        const timeout2=setTimeout(()=>controller2.abort(),20000);
        const r2=await fetch(url2,{redirect:'follow',signal:controller2.signal});
        clearTimeout(timeout2);
        const text2=await r2.text();
        if(text2.includes('認証エラー')){showAlert('❌ パスワードが一致しません。Apps Script側のSECRETを確認してください。','err');}
        else{showAlert('✅ Apps Script接続OK！トークン認証も正常です。','ok');}
      }catch{showAlert('✅ Apps Scriptへの接続は確認できました（トークン認証テストはスキップ）。シート追加をお試しください。','ok');}
      return;
    }
    if(text.trim().startsWith('<')){showAlert('❌ HTMLが返されました。Apps Scriptの再デプロイが必要です。','err');return;}
    // トークンなしでも認証エラーにならない = 古いコード
    showAlert('⚠ Apps Scriptのコードが古い可能性があります。最新コードに差し替えて再デプロイしてください。','err');
  }catch(e){

    else{showAlert('⚠ テスト通信でエラーが発生しましたが、実際のシート接続は正常に動く場合があります。そのままシート追加をお試しください。','info');}
  }
}

async function fetchSheetViaGAS(ssId,tabName,headerRow,maxRows,colorCol){
  if(!state.gasUrl){state.fetchError='Apps ScriptのURLが設定されていません';return null;}
  const hr=headerRow||1;
  let url=state.gasUrl+'?id='+encodeURIComponent(ssId)+'&tab='+encodeURIComponent(tabName)+'&token='+encodeURIComponent(state.gasToken)+'&header='+hr;
  if(maxRows)url+='&max='+maxRows;
  if(colorCol)url+='&colorCol='+colorCol;
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),180000);
    const r=await fetch(url,{redirect:'follow',signal:controller.signal});
    clearTimeout(timeout);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const text=await r.text();
    // GASがHTMLを返すケース（ログインページなど）を検出
    if(text.trim().startsWith('<')||text.includes('<!DOCTYPE')){
      state.fetchError='Apps ScriptからHTMLが返されました。\n\n以下を確認してください:\n・「デプロイを管理」→ ✏ →「新バージョン」→ デプロイ で再デプロイ済みか\n・「アクセスできるユーザー」が「全員」になっているか';
      return null;
    }
    let data;
    try{ data=JSON.parse(text); }catch{ state.fetchError='レスポンスがJSON形式ではありません。Apps Scriptのコードを確認してください。\n\n受信内容: '+text.slice(0,200);return null; }
    if(data.error){
      state.fetchError='エラー: '+data.error;
      if(data.error==='認証エラー') state.fetchError+='\n\nパスワードがApps Script側のSECRETと一致しているか確認してください。';
      return null;
    }
    if(!data.headers||!data.rows){state.fetchError='レスポンス形式が不正です。Apps Scriptのコードが正しいか確認してください。';return null;}
    return data;
  }catch(e){
    if(e.name==='AbortError'){
      state.fetchError='接続がタイムアウトしました（3分）。\n\n対処法:\n・Apps Scriptのコードを最新版に差し替えて再デプロイしてください（空行除外・行数制限に対応）\n・それでもタイムアウトする場合はシート追加時に「最大行数」を設定してください';
    } else {
      state.fetchError='通信エラー: '+e.message+'\n\n確認事項:\n・Apps Scriptを「デプロイを管理」から再デプロイしたか\n・「次のユーザーとして実行」→「自分」\n・「アクセスできるユーザー」→「全員」';
    }
    return null;
  }
}

// ── Color classification for No. column ──
function parseHex(hex){
  const h=(hex||'#ffffff').replace('#','');
  return{r:parseInt(h.slice(0,2),16)||0,g:parseInt(h.slice(2,4),16)||0,b:parseInt(h.slice(4,6),16)||0};
}
function shouldIncludeByColor(hex){
  const{r,g,b}=parseHex(hex);
  // White: skip (r>248 && g>248 && b>248)
  if(r>248&&g>248&&b>248)return false;
  // Everything else → include (gray, red, pink, yellow, green, purple, black, cyan/light blue)
  return true;
}
// ── 色の系統分類（キー・日本語色名・表示色）──
const COLOR_KEYS={
  white:{name:'白（色なし）',bg:'#ffffff',fg:'#666',swatch:'#ffffff'},
  black:{name:'黒/濃グレー',bg:'#e8e8e8',fg:'#333',swatch:'#444444'},
  cyan:{name:'水色',bg:'#e0f2ff',fg:'#1a6fa5',swatch:'#7ec8f0'},
  purple:{name:'紫',bg:'#f0eeff',fg:'#5e3ca8',swatch:'#a98ce0'},
  yellow:{name:'黄色',bg:'#fff4d9',fg:'#ad7a14',swatch:'#f5d356'},
  red:{name:'赤',bg:'#fdeceb',fg:'#b44747',swatch:'#e06060'},
  pink:{name:'ピンク',bg:'#fce4ec',fg:'#c2185b',swatch:'#f5a3c0'},
  gray:{name:'グレー系',bg:'#f3f3f3',fg:'#666',swatch:'#cccccc'},
};
function classifyColorKey(hex){
  const{r,g,b}=parseHex(hex);
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
  if(r>248&&g>248&&b>248)return 'white';
  if(mx<130&&(mx-mn)<30)return 'black';
  if(b>170&&g>150&&b>=g&&r<g)return 'cyan';
  if(b>100&&b>g+25&&r<b+40&&mx>=130)return 'purple';
  if(r>180&&g>170&&b<g-20)return 'yellow';
  if(g>180&&g>b+20&&g>r-30)return 'yellow';
  if(r>180&&(g<120||b<120)&&r>g+30)return 'red';
  if(r>170&&r>g&&g>100&&b>100)return 'pink';
  return 'gray';
}
function colorStatusLabel(hex){
  const key=classifyColorKey(hex);
  const info=COLOR_KEYS[key];
  const title=(state.colorConfig&&state.colorConfig.titles&&state.colorConfig.titles[key])||'';
  return{label:title||('🎨 '+info.name),bg:info.bg,color:info.fg,_key:key};
}
function isNormalColor(hex){
  if(!hex)return true; // 色情報なし（No.列未割当等）は通常扱い
  const key=classifyColorKey(hex);
  return !!(state.colorConfig&&state.colorConfig.normal&&state.colorConfig.normal[key]);
}

// ── Process rows with a colMap (-1 = ハイフン固定) ──
function getVal(row,cm,key){ if(cm[key]===undefined) return undefined; if(cm[key]===-1) return '—'; return (row[cm[key]]||'').trim(); }
function getNum(row,cm,key){ if(cm[key]===undefined) return 0; if(cm[key]===-1) return 0; return parseInt((row[cm[key]]||'0').replace(/[,¥￥$\s]/g,''),10)||0; }

function processRows(rows,cm,colors,sheetName){
  const withSKU=[],withoutSKU=[];
  rows.forEach((row,idx)=>{const sku=cm.sku>=0?(row[cm.sku]||'').trim():'';const e={_source:sheetName||''};
    const name=getVal(row,cm,'name'); if(name!==undefined&&name!=='') e.name=name;
    const price=getNum(row,cm,'price'); if(price) e.price=price;
    const cost=getNum(row,cm,'cost'); if(cost) e.cost=cost;
    const date=getVal(row,cm,'date'); if(date!==undefined&&date!==''&&date!=='—') e.date=date;
    const supplier=getVal(row,cm,'supplier'); if(supplier!==undefined&&supplier!=='') e.supplier=supplier;
    const maker=getVal(row,cm,'maker'); if(maker!==undefined&&maker!=='') e.maker=maker;
    const asin=getVal(row,cm,'asin'); if(asin!==undefined&&asin!=='') e.asin=asin;
    const note=getVal(row,cm,'note'); if(note!==undefined&&note!=='') e.note=note;
    const noVal=getVal(row,cm,'no'); if(noVal!==undefined&&noVal!=='') e.no=noVal;
    const cellColor=(colors&&colors[idx])||null;
    e._noColor=cellColor;
    const _isNorm2=isNormalColor(cellColor);
    if(cellColor&&!_isNorm2) e._colorStatus=colorStatusLabel(cellColor);
    if(sku){
      if(!_isNorm2&&e._colorStatus){
        e.sku=sku;
        withoutSKU.push(e);
      } else {
        withSKU.push({...e,sku});
      }
    } else if(e.name){
      if(cellColor&&isNormalColor(cellColor)) return;
      withoutSKU.push(e);
    }
  });
  return{withSKU,withoutSKU};
}

// ── Aggregate: same SKU rows → count = stock, costs = array ──
function aggregateBySKU(rawRows){
  const map={};
  rawRows.forEach(r=>{
    if(!map[r.sku]){
      map[r.sku]={...r, purchaseQty:1, costs:[r.cost||0], dates:[r.date||'']};
    } else {
      map[r.sku].purchaseQty++;
      map[r.sku].costs.push(r.cost||0);
      (map[r.sku].dates=map[r.sku].dates||[]).push(r.date||'');
      if(r.name&&r.name!=='—') map[r.sku].name=r.name;
      if(r.date&&r.date!=='—') map[r.sku].date=r.date;
      if(r.maker&&r.maker!=='—') map[r.sku].maker=r.maker;
      if(r.asin&&r.asin!=='—') map[r.sku].asin=r.asin;
      if(r.supplier&&r.supplier!=='—') map[r.sku].supplier=r.supplier;
      if(r.price) map[r.sku].price=r.price;
      if(!map[r.sku]._colorStatus&&r._colorStatus) map[r.sku]._colorStatus=r._colorStatus;
      if(!map[r.sku]._noColor&&r._noColor) map[r.sku]._noColor=r._noColor;
      if(!map[r.sku]._source&&r._source) map[r.sku]._source=r._source;
      if(!map[r.sku].no&&r.no) map[r.sku].no=r.no;
    }
  });
  return Object.values(map);
}

function aggregateUnlisted(rawRows){
  const map={};
  rawRows.forEach(r=>{
    const key=r.sku?('S:'+r.sku):('N:'+normN(r.name));
    if(!map[key]){
      map[key]={...r, purchaseQty:1, costs:[r.cost||0], dates:[r.date||''], _id:genId()};
    } else {
      map[key].purchaseQty++;
      map[key].costs.push(r.cost||0);
      (map[key].dates=map[key].dates||[]).push(r.date||'');
      if(!map[key]._colorStatus&&r._colorStatus) map[key]._colorStatus=r._colorStatus;
    }
  });
  return Object.values(map);
}

// ── Sync: runs in background ──
let _syncRunning=false;
async function doSync(fromCache){
  if(_syncRunning){showBanner('同期中です','info');return;}
  _syncRunning=true;
  state.fetchError=null;state.syncResult=null;
  let allWithSKU=[],allWithoutSKU=[];
  let sheetCount=0;
  const _diag=[];
  const _purchaseLog=[];

  try{
  if((state.mode==='auto'||fromCache)&&state.sheets.length>0){
    const btn=document.getElementById('sync-all-btn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> 同期中...';}
    const _detColors={};
    const _noSkuWarn=[];
    for(const sh of state.sheets){
      let data;
      if(fromCache){data=sh._parsed;}
      else{const noColIdx=sh.colMap?.no;const colorCol=(noColIdx!==undefined&&noColIdx>=0)?noColIdx+1:0;data=await fetchSheetViaGAS(sh.ssId,sh.tab,sh.headerRow,sh.maxRows,colorCol);}
      if(!data)continue;
      if(!fromCache)sh._parsed=data;

      // Always run autoMap, then overlay user's manual overrides
      const fresh=autoMap(data.headers);
      if(sh._userOverrides){
        Object.entries(sh._userOverrides).forEach(([k,v])=>{if(v>=0&&v<data.headers.length)fresh[k]=v;});
      }
      sh.colMap=fresh;
      if(sh.colMap.sku===undefined)continue;

      // Diagnostic: what colMap resolves to for first data row
      const d={name:sh.name,colMap:{},sample:{},rowCount:data.rows.length,colorCount:(data.colors||[]).length};
      Object.entries(sh.colMap).forEach(([k,idx])=>{
        d.colMap[k]=`${idx}:${data.headers[idx]||'?'}`;
        if(data.rows[0]&&idx<data.rows[0].length) d.sample[k]=data.rows[0][idx];
      });
      _diag.push(d);

      // Parse rows directly (like original working version)
      const cm=sh.colMap;
      data.rows.forEach((row,idx)=>{
        let sku=cm.sku>=0?(row[cm.sku]||'').trim():'';
        const _dashSku=(sku==='-'||sku==='－');
        if(_dashSku)sku='';
        const e={_source:sh.name||''};
        if(cm.name!==undefined) e.name=(row[cm.name]||'').trim();
        if(cm.price!==undefined){const v=parseInt((row[cm.price]||'0').replace(/[,¥￥$\s]/g,''),10);if(v)e.price=v;}
        if(cm.cost!==undefined){const v=parseInt((row[cm.cost]||'0').replace(/[,¥￥$\s]/g,''),10);if(v)e.cost=v;}
        if(cm.date!==undefined) e.date=_normPurchDate((row[cm.date]||'').trim(), sh.name);
        if(cm.supplier!==undefined) e.supplier=(row[cm.supplier]||'').trim();
        if(cm.maker!==undefined) e.maker=(row[cm.maker]||'').trim();
        if(cm.asin!==undefined) e.asin=(row[cm.asin]||'').trim();
        if(cm.note!==undefined) e.note=(row[cm.note]||'').trim();
        if(cm.no!==undefined) e.no=(row[cm.no]||'').trim();
        // Purchase log: capture every row with date+cost (before any filtering)
        if(e.date&&e.cost&&!(sh.name||'').includes('バッテリー')){
          _purchaseLog.push({date:e.date,cost:e.cost,source:sh.name||'',_name:e.name||'',_sku:sku||'',_asin:e.asin||'',_supplier:e.supplier||''});
        }
        if(_dashSku)return; // SKU「-」＝データ取込不要（仕入額があれば上の仕入ログにのみ計上）
        // Color handling (色分類設定に基づく)
        const cellColor=(data.colors&&data.colors[idx])||null;
        e._noColor=cellColor;
        const _isNorm=isNormalColor(cellColor);
        if(cellColor){
          if(sku||e.name){
            const dk2=classifyColorKey(cellColor);
            _detColors[dk2]=(_detColors[dk2]||0)+1;
          }
          if(!_isNorm) e._colorStatus=colorStatusLabel(cellColor);
        }
        if(sku){
          if(isReimbursedSku(sku))return; // Amazon補填済み（商品は戻らない）→棚卸対象外
          if(!_isNorm&&e._colorStatus){
            // SKU有+未出品扱いの色 → 未出品在庫（SKU表示付き）
            e.sku=sku;
            allWithoutSKU.push(e);
          } else {
            // SKU有+出品後在庫の色 → products（販路CSVと照合用）
            allWithSKU.push({...e,sku});
          }
        } else if(e.name){
          // SKU無+出品後在庫の色 → 警告（データには取り込まない）/ SKU無+その他の色 → 未出品在庫
          if(cellColor&&isNormalColor(cellColor)){
            _noSkuWarn.push({name:e.name,date:e.date||'',supplier:e.supplier||'',source:sh.name||'',colorKey:classifyColorKey(cellColor),row:(e.no||String(idx+2)),_rawSku:sku||''});
            return;
          }
          if(!e._colorStatus&&cellColor&&!isNormalColor(cellColor))e._colorStatus=colorStatusLabel(cellColor);
          allWithoutSKU.push(e);
        }
      });

      sh._lastCount=data.rows.length;
      sheetCount++;
    }
    // 新色検出: 保存済み設定にない色が見つかったら設定を再展開
    {
      const prevKeys=new Set(Object.keys(state._detectedColors||{}));
      const knownKeys=new Set([...Object.keys(state.colorConfig.normal||{}),...Object.keys(state.colorConfig.titles||{}),...prevKeys]);
      const newKeys=Object.keys(_detColors).filter(k=>!knownKeys.has(k));
      if(newKeys.length>0&&state.colorConfig.step1Saved){
        state._newColorKeys=newKeys;
        state._c1Open=true;state._c2Open=true;
      } else {
        state._newColorKeys=null;
      }
    }
    state._detectedColors=_detColors;
    state._noSkuWarnings=_noSkuWarn;
    if(sheetCount===0){if(!state.fetchError)state.fetchError='同期できるシートがありません。（シート未登録またはSKU列の割当がありません）';save();_syncRunning=false;showBanner('同期失敗: '+String(state.fetchError).split('\n')[0],'err');renderAll();return;}
  } else if(state.mode==='paste'&&state.parsed){
    const cm=state.colMap||{};
    if(cm.sku===undefined){state.fetchError='SKUカラムの割り当てが必要です';_syncRunning=false;renderAll();return;}
    const{withSKU,withoutSKU}=processRows(state.parsed.rows,cm);
    allWithSKU.push(...withSKU);allWithoutSKU.push(...withoutSKU);sheetCount=1;
  } else { _syncRunning=false;renderAll(); return; }

  // Aggregate by SKU
  state.products=aggregateBySKU(allWithSKU);
  state.unlisted=aggregateUnlisted(allWithoutSKU);
  state.purchaseLog=_purchaseLog;
  // 同期後の再マッチ: 取込時に管理表未登録だったラクマ/メルカリ売上へSKU・仕入値を自動補完
  {
    let _rm=0;
    const _n2p={};state.products.forEach(p=>{if(p.name&&p.sku){(_n2p[p.name]=_n2p[p.name]||[]).push(p);}});
    [...(state.sales_rakuma||[]),...(state.sales_mercari_direct||[]),..._cuAllRows()].forEach(row=>{
      const _sk=(row['SKU']||'').trim();
      if(_sk){
        if(!row._costFixed&&!parseInt(row['仕入']||'0',10)){const pe2=(state.products||[]).find(p=>p.sku===_sk);if(pe2){row['仕入']=String(pe2.cost||0);_rm++;}}
        return;
      }
      const g=_n2p[(row['商品名']||'').trim()];
      if(g&&g.length===1){row['SKU']=g[0].sku;if(!row._costFixed&&!parseInt(row['仕入']||'0',10))row['仕入']=String(g[0].cost||0);_rm++;}
    });
    if(_rm>0){try{showBanner('同期に伴い、ラクマ・メルカリ売上 '+_rm+'件にSKU・仕入値を自動補完しました','ok');}catch(e){}}
  }
  _sweepSoldUnlisted(true);
  // ラクマ/メルカリ（直）: SKU空欄の売上行を最新の商品データで自動再マッチ（手動入力・既存値は不変）
  {
    const n2s={},s2c={};state.products.forEach(p=>{if(p.name&&p.sku&&!n2s[p.name]){n2s[p.name]=p.sku;s2c[p.sku]=p.cost||0;}});
    let _rm=0;
    [...(state.sales_rakuma||[]),...(state.sales_mercari_direct||[]),..._cuAllRows()].forEach(rw=>{
      if((rw['SKU']||'').trim())return;
      const s=n2s[(rw['商品名']||'').trim()];
      if(s){rw['SKU']=s;if(!rw._costFixed&&!(parseInt(rw['仕入']||'0',10)>0))rw['仕入']=String(s2c[s]||'');_rm++;}
    });
    if(_rm>0){try{showBanner('同期した商品情報でラクマ・メルカリ売上のSKU・仕入値を'+_rm+'件自動補完しました','ok');}catch(e){}}
  }
  if(!fromCache)state.lastSync=new Date().toISOString();
  state.syncResult={total:state.products.length,unlisted:state.unlisted.length,sheetCount,_diag};
  save();
  // Show diagnostic banner
  let msg=`同期完了（${sheetCount}シート / ${state.products.length}件 / 仕入ログ${_purchaseLog.length}件）`;
  _diag.forEach(d=>{
    const s=d.sample;
    msg+=`\n📄${d.name}(${d.rowCount}行): cost=${s.cost||'❌未検出'} / date=${s.date||'❌未検出'} / asin=${s.asin||'❌未検出'}`;
  });
  if(!fromCache)showBanner(msg,'ok');
  }catch(e){state.fetchError='同期エラー: '+e.message;showBanner('同期エラー: '+e.message,'err');}
  _syncRunning=false;renderAll();
}
window.doSync=doSync;

async function handleCSVUpload(platform,input){
  const file=input.files?.[0];if(!file)return;
  let text;
  try {
    const buf = await file.arrayBuffer();
    text = new TextDecoder('utf-8').decode(buf);
    const garbled = (text.match(/\ufffd/g)||[]).length;
    if (garbled > 5 || (/[\x80-\xff]{4,}/.test(text) && !/[\u3000-\u9fff]/.test(text))) {
      text = new TextDecoder('shift_jis').decode(buf);
    }
  } catch { text = await file.text(); }

  let data = parseCSV(text);

  // Yahoo: filter quantity >= 1
  if(platform==='yahoo' && data.length>0 && data[0]['code']!==undefined){
    const totalBefore = data.length;
    data = data.filter(r => parseInt(r['quantity']||'0',10) >= 1);
    showAlert(`Yahoo!: ${totalBefore}件中、在庫あり ${data.length}件を抽出`,'ok');
  }

  state[platform]=_slimRows(data);
  state.lastUpload={...state.lastUpload,[platform]:new Date().toISOString()};
  try{_resetSrcDone(platform);}catch(e){}
  save();showAlert((PL[platform]||platform)+'のCSVを取り込みました（'+data.length+'行）','ok');renderAll();
}

function addSelectedNA(){let checked=[...document.querySelectorAll('.na-check:checked')].map(cb=>cb.value);if(!checked.length)return;const _fo=checked.filter(sku=>{const pe=state.products.find(p=>p.sku===sku)||(state.unlisted||[]).find(u=>u.sku&&u.sku===sku);return pe&&_invPurchaseInfo(pe).kind==='future';});if(_fo.length){checked=checked.filter(s=>!_fo.includes(s));showBanner('翌月以降の仕入のみの商品 '+_fo.length+'件（'+_fo.slice(0,3).join('・')+(_fo.length>3?'…':'')+'）は、この月の棚卸には追加できません（基準月を翌月に切り替えてください）','warn');}checked.forEach(sku=>{state.nai[sku]=true;});save();renderAll();}
window.addSelectedNA=addSelectedNA;
function deleteSelectedNA(){
  const checked=[...document.querySelectorAll('.na-check:checked')].map(cb=>cb.value);
  if(!checked.length)return;
  if(!confirm(checked.length+'件のAmazon外商品を削除しますか？\nメルカリShops・Yahoo!のデータから除外されます。'))return;
  const delSet=new Set(checked);
  state.mercari=(state.mercari||[]).filter(r=>!delSet.has(fSKU(r)));
  state.yahoo=(state.yahoo||[]).filter(r=>!delSet.has(fSKU(r)));
  checked.forEach(sku=>{delete state.nai[sku];});
  save();renderAll();
}
window.deleteSelectedNA=deleteSelectedNA;
function removeNA(sku){delete state.nai[sku];save();renderAll();}
window.removeNA=removeNA;

function clearAllNA(){if(!confirm('棚卸に追加済みのAmazon外商品をすべて解除しますか？'))return;state.nai={};save();renderAll();}
window.clearAllNA=clearAllNA;

// ═══════════════════════════ INIT ═══════════════════════════
if(state.sheets.length>0) state.mode='auto';

// 色検出の復元: _detectedColorsが空でも、シートに残る色データ(_parsed.colors)から数え直す
// （別ブラウザ・保存領域リセット・localStorage満杯退避で検出一覧だけ失われるケースの根本対策）
function _recoverDetectedColors(){
  try{
    if(state._detectedColors&&Object.keys(state._detectedColors).length>0)return false;
    const det={};
    (state.sheets||[]).forEach(sh=>{
      const p=sh&&sh._parsed;if(!p||!Array.isArray(p.rows)||!Array.isArray(p.colors)||!p.colors.length)return;
      const cm=sh.colMap||{};
      p.rows.forEach((row,idx)=>{
        let sku=(cm.sku>=0)?((row[cm.sku]||'')+'').trim():'';
        if(sku==='-'||sku==='－')return;
        const name=(cm.name!==undefined)?((row[cm.name]||'')+'').trim():'';
        const c=p.colors[idx]||null;
        if(c&&(sku||name)){const dk=classifyColorKey(c);det[dk]=(det[dk]||0)+1;}
      });
    });
    if(Object.keys(det).length>0){state._detectedColors=det;try{SS('inv_detected_colors',det);}catch(e){}return true;}
  }catch(e){}
  return false;
}
window._recoverDetectedColors=_recoverDetectedColors;
// RENDER IMMEDIATELY with localStorage (no waiting)
_recoverDetectedColors();
renderAll();

// Then try Firebase sync in background (non-blocking)
(async function bgSync(){
  try{
    if(!fbConnected)return;
    const authed=await _anonAuth();
    if(!authed)return;
    const snap=await Promise.race([
      fbRef.child('state').once('value'),
      new Promise((_,r)=>setTimeout(()=>r('timeout'),5000))
    ]);
    const fbData=snap.val();
    if(fbData){
      // タイムスタンプ比較: ローカルの方が新しければクラウドで上書きしない（データ消失防止）
      const fbTime=fbData._lastModified||0;
      const localTime=state._lastModified||0;
      const _fbCore=(fbData.products||[]).length+(fbData.sales_priceter||[]).length+(fbData.purchaseLog||[]).length+(fbData.sheets||[]).length;
      const _lcCore=(state.products||[]).length+(state.sales_priceter||[]).length+(state.purchaseLog||[]).length+(state.sheets||[]).length;
      if(localTime>fbTime&&!(_lcCore===0&&_fbCore>0)){
        window._fbPulled=true;
        console.log('Firebase sync: local is newer ('+new Date(localTime).toLocaleString()+' > '+(fbTime?new Date(fbTime).toLocaleString():'なし')+') — uploading local data');
        save();
        return;
      }
      const keys=['products','unlisted','removed','amazon_fba','amazon_self','mercari','mercariFiles','yahoo','returns','nai','lastSync','lastUpload','sheets','gasUrl','gasToken','sales_priceter','sales_mercari','sales_yahoo','mercari_orders','yahoo_fees','rakuma_fees','auction_fees','pendingShip','_manualPending','monthlyData','purchaseLog','selectedYear','selectedMonth','removedPending','sales_yafuoku','sales_mercari_direct','sales_rakuma','customChannels','sales_custom','colorConfig','openingInv','yafuoku_ship_deduct','reimbursements','reimbursedSkus','expenses','creditCards','loans','expenseAccounts','enabledChannels','setupDone','monthlyTasks','yahooOrderTimes','mePreOverrides','costFix','dupDecisions','mdCancelConf','meSkuFix','mePreCxRes','feesMonthly','feesYM','feesSet','manualHist','resetPending','lastReset','prepYM','cxDupDec','manualInv'];
      // クラウド適用前の自動退避（同期による上書き事故からの復元用・IndexedDBは容量制限が緩い）
      try{
        if(((state.sales_priceter||[]).length+(state.products||[]).length+(state.purchaseLog||[]).length+(state.monthlyData||[]).length)>0){
          const _snap={};Object.keys(state).forEach(k=>{if(k.charAt(0)!=='_')_snap[k]=state[k];});
          _idbSet('presync_backup',{at:new Date().toISOString(),data:_snap}).catch(()=>{});
        }
      }catch(e){}
      let changed=false;
      // クラウドに実データがあることを記録（空上書きガード用）
      if(((fbData.products||[]).length+(fbData.sales_priceter||[]).length+(fbData.purchaseLog||[]).length)>0)SS('inv_cloud_had_data',1);
      if(fbTime>localTime){state._lastModified=fbTime;SS('inv_last_modified',fbTime);}
      const _hasData=(k,v)=>{
        if(v===undefined||v===null)return false;
        if(Array.isArray(v))return v.length>0;
        if(k==='expenses')return ((v.fixed||[]).length>0)||Object.keys(v.monthly||{}).length>0;
        if(typeof v==='object')return Object.keys(v).length>0;
        return true;
      };
      const _protectKeys=['expenses','creditCards','loans','expenseAccounts','reimbursements','reimbursedSkus','monthlyData','yahooOrderTimes'];
      keys.forEach(k=>{
        if(fbData[k]===undefined)return;
        if(_protectKeys.includes(k)&&!_hasData(k,fbData[k])&&_hasData(k,state[k])){
          console.warn('同期保護: クラウド側が空のため上書きしない →',k);
          return; // ローカルの実データを守る（次のsaveでクラウドへ再送信される）
        }
        if(JSON.stringify(state[k])!==JSON.stringify(fbData[k])){state[k]=fbData[k];changed=true;}
      });
      migrateExpAccounts(); // クラウドの旧科目リストで上書きされた場合も再移行
      ['products','unlisted','removed','amazon_fba','amazon_self','mercari','yahoo','returns','sales_priceter','sales_mercari','sales_yahoo','mercari_orders','monthlyData','purchaseLog','_manualPending','sales_yafuoku','sales_mercari_direct','sales_rakuma'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[];});
      if(!Array.isArray(state.customChannels))state.customChannels=[];if(!state.sales_custom||typeof state.sales_custom!=='object'||Array.isArray(state.sales_custom))state.sales_custom={};
if(!state.colorConfig||typeof state.colorConfig!=='object')state.colorConfig={normal:{white:1},titles:{}};
if(!state.colorConfig.titles)state.colorConfig.titles={};
if(!state.colorConfig.normal)state.colorConfig.normal={white:1};
if(state.colorConfig.normal.white===undefined)state.colorConfig.normal.white=1;
      ['nai','lastUpload','pendingShip','removedPending'].forEach(k=>{if(!state[k]||typeof state[k]!=='object')state[k]={};});
      if(!state.yahoo_fees||typeof state.yahoo_fees!=='object')state.yahoo_fees={commission:6.5,pr_ad:0,coupons:[]};
      if(!state.auction_fees||typeof state.auction_fees!=='object')state.auction_fees={commission:7.7,pr_ad:0,high_price_rate:0,high_price_threshold:0,high_price_target:0,coupons:[]};
      if(!state.sheets)state.sheets=[];
      try{const ds=await Promise.race([fbRef.child('monthly_detail').once('value'),new Promise((_,r)=>setTimeout(()=>r('timeout'),3000))]);const det=ds.val();if(det){if(!window._mdCache)window._mdCache={};Object.entries(det).forEach(([k,v])=>{window._mdCache[k]=v;});try{_mdCloudReconcile(det).catch(e=>console.warn('cloud reconcile:',e));}catch(e){}}}catch(e){}
      if(state.sheets.length>0)state.mode='auto';
      if(_recoverDetectedColors())changed=true;
      // Save to localStorage as cache
      SS('inv_products',state.products);SS('inv_unlisted',state.unlisted);SS('inv_removed',state.removed);SS('inv_amazon_fba',state.amazon_fba);SS('inv_amazon_self',state.amazon_self);SS('inv_mercari',state.mercari);SS('inv_yahoo',state.yahoo);SS('inv_returns',state.returns);SS('inv_nai',state.nai);SS('inv_sync',state.lastSync);SS('inv_upload',state.lastUpload);SS('inv_sheets',state.sheets);SS('inv_gas',state.gasUrl);SS('inv_gas_token',state.gasToken);SS('inv_sales_priceter',state.sales_priceter);SS('inv_sales_mercari',state.sales_mercari);SS('inv_sales_yahoo',state.sales_yahoo);SS('inv_mercari_orders',state.mercari_orders);SS('inv_yahoo_fees',state.yahoo_fees);SS('inv_auction_fees',state.auction_fees);SS('inv_pending',state.pendingShip);SS('inv_manual_pending',state._manualPending);SS('inv_monthly',state.monthlyData);SS('inv_purchase_log',state.purchaseLog);SS('inv_sel_year',state.selectedYear);SS('inv_sel_month',state.selectedMonth);SS('inv_removed_pending',state.removedPending);
      window._fbPulled=true;
      if(changed){renderAll();console.log('Firebase sync: updated from cloud');}
      else console.log('Firebase sync: already up to date');
    } else {
      // Firebase empty — upload localStorage data
      window._fbPulled=true;
      save();
      console.log('Firebase sync: uploaded local data');
    }
  }catch(e){console.warn('Background Firebase sync skipped:',e);}
})();</script>
